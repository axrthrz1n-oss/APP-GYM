/* ---------- Status ---------- */
const statusEl = document.getElementById("status");
const STATUS = {loading:"Conectando…", saving:"Salvando…", saved:"Salvo", local:"No aparelho", offline:"Sem conexão", full:"Limite atingido"};
function setStatus(k){ statusEl.textContent = STATUS[k] || STATUS.saved; statusEl.dataset.k = k; }
function anyPending(){ return Object.values(state.timers).some(Boolean) || Object.values(state.writing).some(Boolean); }

/* ---------- Dados ---------- */
function previous(exId){
  const heavy = arr => heavyPart(exId, arr).some(x => x && (x.kg != null || x.reps != null));
  return previousWhere(exId, heavy, true) || previousWhere(exId, hasData, true) || previousWhere(exId, hasData, false);
}
function previousWhere(exId, ok, skipDeload){
  const cur = curId(); let best = null;
  for (const [id, s] of Object.entries(state.sessions)){
    if (id === cur || !s || !s.sets) continue;
    if (skipDeload && s.deload) continue;
    const arr = s.sets[exId]; if (!ok(arr)) continue;
    if (!best || s.date > best.date || (s.date === best.date && (s.updatedAt || "") > (best.updatedAt || ""))) best = {date:s.date, updatedAt:s.updatedAt, arr};
  }
  return best;
}
function bestKgBefore(exId){
  const cur = curId(); let best = null;
  for (const [id, s] of Object.entries(state.sessions)){
    if (id === cur || !s || !s.sets || !Array.isArray(s.sets[exId])) continue;
    s.sets[exId].forEach(x => { if (x && x.kg != null && x.reps) best = best == null ? x.kg : Math.max(best, x.kg); });
  }
  return best;
}
function history(exId, limit){
  return Object.values(state.sessions)
    .filter(s => s && s.sets && hasData(s.sets[exId]))
    .sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.updatedAt || "").localeCompare(a.updatedAt || ""))
    .slice(0, limit).map(s => ({date:s.date, arr:s.sets[exId], deload:!!s.deload}));
}
/* força estimada da melhor série pesada (Epley): carga × (1 + reps/30) */
function bestE1rm(arr, exId){
  if (!Array.isArray(arr)) return null;
  const score = list => list.reduce((m, x) => x && x.kg != null && x.reps != null && x.kg > 0 && x.reps > 0 ? Math.max(m, x.kg * (1 + x.reps / 30)) : m, 0);
  const heavy = score(exId ? heavyPart(exId, arr) : arr.slice(1));
  const v = heavy || score(arr.slice(0, 1));
  return v || null;
}
function fmtPct(p){
  if (p == null || !isFinite(p)) return {cls:"", txt:"—"};
  const r = Math.abs(p) < 10 ? Math.round(p * 10) / 10 : Math.round(p);
  if (Math.abs(r) < 0.5) return {cls:"eq", txt:"="};
  return {cls:r > 0 ? "up" : "down", txt:`${r > 0 ? "+" : "−"}${String(Math.abs(r)).replace(".", ",")}%`};
}
function hitTarget(ex, arr){
  if (!Array.isArray(arr)) return false;
  const hi = heavyIdx(ex);
  return hi.length > 0 && hi.every(i => { const s = arr[i]; return s && s.reps != null && s.reps >= ex.sets[i].goal; });
}
function maxHeavyKg(arr, exId){
  if (!Array.isArray(arr)) return null;
  const v = (exId ? heavyPart(exId, arr) : arr.slice(1)).map(s => s && s.kg).filter(k => k != null);
  return v.length ? Math.max(...v) : null;
}
function fmtSet(s){
  if (!s) return "";
  if (s.kg != null && s.reps != null) return `${fmtKg(s.kg)} kg × ${s.reps}`;
  if (s.kg != null) return `${fmtKg(s.kg)} kg`;
  if (s.reps != null) return `× ${s.reps}`;
  return "";
}

function roundLoad(x){ const step = x < 20 ? 0.5 : 1; return Math.round(x / step) * step; }
/* ---------- Libras → kg ---------- */
const LB = 0.45359237;
state.unitDone = {};
function unitHint(ex, arr, prev){
  const done = state.unitDone[ex.id];
  if (done) return `<p>Registros anteriores convertidos para kg (${done.count} ${done.count === 1 ? "treino" : "treinos"}).</p><div class="uf-act"><button type="button" data-unit-undo="${ex.id}">Desfazer</button><button type="button" data-unit-ok="${ex.id}">Ok</button></div>`;
  if (deloadNow() || !prev || !Array.isArray(arr)) return "";
  const skip = (state.config.unitOk || {})[ex.id];
  if (skip && skip >= isoToday()) return "";
  let cur = maxHeavyKg(arr, ex.id), old = maxHeavyKg(prev.arr, ex.id);
  if (!(cur > 0) || !(old > 0)){ cur = arr[0] && arr[0].kg; old = prev.arr[0] && prev.arr[0].kg; }
  if (!(cur > 0) || !(old > 0)) return "";
  const r = cur / old;
  if (r < 0.38 || r > 0.56) return "";
  return `<p><b>Mudou de libras para kg?</b> A carga ficou em menos da metade do último treino (${fmtKg(old)} → ${fmtKg(cur)}). Se os registros anteriores estavam em libras, converta para o histórico e as sugestões continuarem certos.</p>
    <div class="uf-act"><button type="button" class="primary" data-unit-conv="${ex.id}">Converter anteriores para kg</button><button type="button" data-unit-skip="${ex.id}">A carga caiu mesmo</button></div>`;
}
function convertLb(exId){
  const cur = curId(), before = {};
  let count = 0;
  Object.entries(state.sessions).forEach(([id, s]) => {
    if (id === cur || !s || !s.sets || !Array.isArray(s.sets[exId])) return;
    const arr = s.sets[exId];
    if (!arr.some(x => x && x.kg > 0)) return;
    before[id] = JSON.parse(JSON.stringify(arr));
    s.sets[exId] = arr.map(x => x && x.kg > 0 ? Object.assign({}, x, {kg:Math.round(x.kg * LB * 2) / 2}) : x);
    touch(id); count++;
  });
  if (count) state.unitDone[exId] = {count, before};
  refresh();
}
function undoLb(exId){
  const d = state.unitDone[exId]; if (!d) return;
  Object.entries(d.before).forEach(([id, arr]) => { const s = state.sessions[id]; if (s && s.sets){ s.sets[exId] = arr; touch(id); } });
  delete state.unitDone[exId];
  refresh();
}
document.addEventListener("click", e => {
  if (state.view !== "treino" || !e.target.closest || !e.target.closest("#app")) return;
  const c = e.target.closest("[data-unit-conv]");
  if (c){
    const id = c.dataset.unitConv, name = (exOf(id) || {}).name || id;
    if (c.hasAttribute("data-manual") && !confirm(`Converter todos os registros anteriores de "${name}" de libras para kg? Use só se eles estavam em libras. Dá para desfazer logo em seguida.`)) return;
    convertLb(id); return;
  }
  const u = e.target.closest("[data-unit-undo]"); if (u){ undoLb(u.dataset.unitUndo); return; }
  const ok = e.target.closest("[data-unit-ok]"); if (ok){ delete state.unitDone[ok.dataset.unitOk]; refresh(); return; }
  const sk = e.target.closest("[data-unit-skip]");
  if (sk){ state.config.unitOk = Object.assign({}, state.config.unitOk || {}, {[sk.dataset.unitSkip]:isoToday()}); writeCfg(); refresh(); }
});
function firstSetHint(ex, arr, prev, isFirst){
  if (deloadNow()){
    const kg = prev ? maxHeavyKg(prev.arr, ex.id) : null;
    return kg ? `Semana leve: <b>${fmtKg(kg)} kg</b> nas duas séries, parando 2 a 3 reps antes da falha` : "";
  }
  if (ex.pyramid) return pyrHint(ex, arr, 0);
  const goal = (ex.sets[1] || ex.sets[0]).goal;
  const bestSet = a => {
    let b = null;
    (Array.isArray(a) ? a.slice(1) : []).forEach(x => { if (x && x.kg > 0 && x.reps > 0){ const e = e1rm(x.kg, x.reps); if (!b || e > b.e) b = {kg:x.kg, reps:x.reps, e}; } });
    return b;
  };
  let ref = bestSet(arr);
  if (!ref && arr && arr[1] && arr[1].kg > 0) ref = {kg:arr[1].kg, reps:null};
  if (!ref) ref = bestSet(prev && prev.arr);
  if (!ref && prev){ const k = maxHeavyKg(prev.arr); if (k > 0) ref = {kg:k, reps:null}; }
  if (!ref) return "";
  /* carga equivalente à meta das séries pesadas: considera carga e repetições */
  const base = ref.reps ? loadFor(ref.e, goal) : ref.kg;
  const iso = ex.sets[0].goal === 15;
  const [pl, ph] = isFirst ? [0.6, 0.7] : iso ? [0.8, 0.9] : [0.7, 0.8];
  const lo = roundLoad(base * pl), hi = roundLoad(base * ph);
  const range = lo === hi ? `${fmtKg(lo)} kg` : `${fmtKg(lo)} a ${fmtKg(hi)} kg`;
  const src = ref.reps ? `${fmtKg(ref.kg)} kg × ${ref.reps}` : `${fmtKg(ref.kg)} kg`;
  return `Sugestão: <b>${range}</b> (${isFirst ? "para aquecer, " : ""}base: ${src})`;
}
/* sugestão para a próxima série pesada, com base na série que acabou de ser feita */
/* pirâmide invertida: sugestão de carga para a série i (0 = a pesada) */
function pyrHint(ex, arr, i){
  const sets = setsFor(ex), t = sets[i];
  if (!t || deloadNow()) return "";
  const a = Array.isArray(arr) ? arr : [];
  if (a[i] && a[i].done) return "";
  const n = `${i + 1}ª série`, last = i === sets.length - 1;
  if (i === 0){
    const p = progression(ex, lastBase(ex));
    if (!p) return `${n}: a mais pesada. Escolha uma carga que dê <b>8 a 12 repetições</b> até a falha`;
    if (p.kind === "up") return `${n}: <b>suba para ${fmtKg(p.kg)} kg</b> e busque ${t.goal}, até a falha`;
    if (p.kind === "down") return `${n}: <b>baixe para ${fmtKg(p.kg)} kg</b> e busque ${t.goal}, até a falha`;
    return `${n}: <b>${fmtKg(p.kg)} kg</b> e tente ${p.target || t.goal}, até a falha`;
  }
  let base = a[i - 1] && a[i - 1].kg > 0 ? a[i - 1].kg : null;
  if (base == null && i === 1){ const p = progression(ex, lastBase(ex)); if (p) base = p.kg; }
  if (base == null) return "";
  const lo = roundLoad(base * 0.85), hi = Math.min(roundLoad(base * 0.9), base);
  const range = lo >= hi ? `${fmtKg(lo)} kg` : `${fmtKg(lo)} a ${fmtKg(hi)} kg`;
  return `${n}: <b>${range}</b> (10–15% menos)${last ? ` e vá <b>até não aguentar</b>` : ` e busque ${t.label} repetições`}`;
}
function nextSetHint(ex, arr, j){
  if (ex.pyramid) return pyrHint(ex, arr, j + 1);
  if (deloadNow() || !Array.isArray(arr)) return "";
  const src = arr[j], nxt = arr[j + 1], t = setsFor(ex)[j + 1];
  if (!src || !t || !(src.kg > 0) || !(src.reps > 0) || (nxt && nxt.done)) return "";
  const goal = t.goal, minReps = goal >= 12 ? 8 : 5, kg = src.kg, step = loadStep(kg);
  const eNext = e1rm(kg, Math.max(1, src.reps - 1));   /* na série seguinte, costuma sair ~1 repetição a menos */
  const target = loadFor(eNext, goal);
  const pred = L => Math.max(1, Math.round(30 * (eNext / L - 1)));
  const n = `${j + 2}ª série`;
  if (target - kg >= step * 0.75){
    const L = kg + Math.min(2, Math.max(1, Math.round((target - kg) / step))) * step;
    return `${n}: <b>suba para ${fmtKg(L)} kg</b> e busque ${goal} (deve dar cerca de ${pred(L)})`;
  }
  if (src.reps < minReps){
    const L = Math.max(step, kg - Math.min(3, Math.max(1, Math.round((kg - target) / step))) * step);
    return `${n}: <b>baixe para ${fmtKg(L)} kg</b> para chegar perto de ${goal}`;
  }
  const p = pred(kg);
  return `${n}: <b>mantenha ${fmtKg(kg)} kg</b> e busque ${goal}${p >= goal ? ` (deve dar cerca de ${p})` : ""}`;
}
/* força estimada (Epley) e carga para um número de repetições */
function e1rm(kg, reps){ return kg * (1 + reps / 30); }
function loadFor(e, reps){ return e / (1 + reps / 30); }
function loadStep(kg){
  const step = kg < 10 ? 1 : kg < 60 ? 2.5 : 5;
  return Math.max(step, Math.round((kg * 0.05) / step) * step);
}
function progression(ex, arr){
  if (!Array.isArray(arr)) return null;
  const hi = heavyIdx(ex);
  if (!hi.length) return null;
  const heavy = hi.map(i => ({x:arr[i], goal:ex.sets[i].goal})).filter(o => o.x && o.x.kg != null && o.x.reps != null);
  if (!heavy.length) return null;
  const top = Math.max(...heavy.map(o => o.x.kg));
  const atTop = heavy.filter(o => o.x.kg === top);
  const goal = ex.sets[hi[0]].goal;
  const minReps = goal >= 12 ? 8 : 5;
  const inc = loadStep(top);
  const complete = atTop.length === hi.length;
  const weakest = Math.min(...atTop.map(o => e1rm(o.x.kg, o.x.reps)));
  const target = loadFor(weakest, goal);   /* carga que daria a meta de repetições, pela série mais fraca */
  if (complete && atTop.every(o => o.x.reps >= goal)){
    const steps = Math.min(3, Math.max(1, Math.round((target - top) / inc)));
    const add = steps * inc;
    return {kind:"up", kg:top + add, add, steps, reps:atTop.map(o => o.x.reps)};
  }
  if (atTop.some(o => o.x.reps < minReps)){
    const steps = Math.min(3, Math.max(1, Math.round((top - target) / inc)));
    return {kind:"down", kg:Math.max(0, top - steps * inc), add:-steps * inc, minReps};
  }
  if (!complete && atTop.every(o => o.x.reps >= goal)) return {kind:"all", kg:top, goal};
  const low = Math.min(...atTop.map(o => o.x.reps));
  return {kind:"keep", kg:top, target:Math.min(goal, low + 1), goal};
}
/* último treino normal (sem semana leve) com as séries pesadas completas */
function lastBase(ex){
  const heavyFilled = a => Array.isArray(a) && heavyIdx(ex).every(i => { const x = a[i]; return x && x.kg != null && x.reps != null; });
  const cur = curId(); let best = null;
  for (const [id, s] of Object.entries(state.sessions)){
    if (id === cur || !s || !s.sets || s.deload || !heavyFilled(s.sets[ex.id])) continue;
    if (!best || s.date > best.date || (s.date === best.date && (s.updatedAt || "") > (best.updatedAt || ""))) best = s;
  }
  return best ? best.sets[ex.id] : null;
}
/* sugestão para a 2ª série: pelo último treino; sem histórico, estima pela 1ª série de hoje */
function secondSetHint(ex, arr){
  if (deloadNow()) return "";
  if (ex.pyramid) return pyrHint(ex, arr, 1);
  const t = setsFor(ex)[1];
  if (!t || (Array.isArray(arr) && arr[1] && arr[1].done)) return "";
  const goal = t.goal;
  const p = progression(ex, lastBase(ex));
  if (p){
    if (p.kind === "up") return `2ª série: <b>suba para ${fmtKg(p.kg)} kg</b> e busque ${goal}`;
    if (p.kind === "down") return `2ª série: <b>baixe para ${fmtKg(p.kg)} kg</b> e busque ${goal}`;
    if (p.kind === "all") return `2ª série: <b>${fmtKg(p.kg)} kg</b> e busque ${goal}`;
    return `2ª série: <b>mantenha ${fmtKg(p.kg)} kg</b> e tente ${p.target}`;
  }
  const s1 = Array.isArray(arr) ? arr[0] : null;
  if (s1 && s1.kg > 0 && s1.reps > 0){
    const raw = loadFor(e1rm(s1.kg, s1.reps + 3), goal);   /* 1ª série controlada: ~3 repetições de reserva */
    const step = raw < 10 ? 1 : raw < 60 ? 2.5 : 5;
    const L = Math.max(s1.kg, Math.floor(raw / step) * step);
    return `2ª série: <b>cerca de ${fmtKg(L)} kg</b> e busque ${goal} (estimativa pela 1ª série)`;
  }
  return "";
}
function progressionText(ex, arr, prev){
  if (deloadNow()) return {cls:"", html:`Semana leve: <b>não suba a carga</b>. Na semana que vem, volte às 3 séries e siga a sugestão normal.`};
  const heavyFilled = a => Array.isArray(a) && heavyIdx(ex).every(i => { const x = a[i]; return x && x.kg != null && x.reps != null; });
  const useToday = heavyFilled(arr);
  const base = useToday ? arr : lastBase(ex);
  const p = progression(ex, base);
  if (!p) return {cls:"", html:""};
  const when = useToday ? "Próximo treino" : "Hoje";
  if (ex.pyramid){
    if (p.kind === "up") return {cls:"up", html:`${when}: <b>suba a 1ª série para ${fmtKg(p.kg)} kg</b> (+${fmtKg(p.add)} kg). As outras acompanham, 10 a 15% mais leves a cada série.`};
    if (p.kind === "down") return {cls:"down", html:`${when}: <b>volte a 1ª série para ${fmtKg(p.kg)} kg</b>. Com menos de ${p.minReps} repetições, a carga está pesada demais.`};
    return {cls:"", html:`${when}: <b>mantenha ${fmtKg(p.kg)} kg na 1ª série</b> e tente chegar a ${p.target || p.goal} repetições. Sobe quando fizer ${p.goal} nela.`};
  }
  if (p.kind === "up") return {cls:"up", html:`${when}: <b>suba para ${fmtKg(p.kg)} kg</b> nas séries pesadas (+${fmtKg(p.add)} kg)${p.steps > 1 ? `, porque você fez ${Math.min(...p.reps)} ou mais repetições` : ""}.`};
  if (p.kind === "down") return {cls:"down", html:`${when}: <b>volte para ${fmtKg(p.kg)} kg</b>. Com menos de ${p.minReps} repetições, a carga está pesada demais.`};
  if (p.kind === "all") return {cls:"", html:`${when}: <b>faça todas as séries pesadas com ${fmtKg(p.kg)} kg</b>. Sobe quando fizer ${p.goal} em todas.`};
  return {cls:"", html:`${when}: <b>mantenha ${fmtKg(p.kg)} kg</b> e tente chegar a ${p.target} repetições. Sobe quando fizer ${p.goal} em todas as séries pesadas.`};
}
function ensureArr(ex){
  const id = curId();
  let s = state.sessions[id];
  if (!s){ s = {date:isoToday(), workout:DAYS[state.day].workout || "extra", sets:{}}; state.sessions[id] = s; }
  if (!s.sets) s.sets = {};
  s.deload = deloadNow();
  let arr = Array.isArray(s.sets[ex.id]) ? s.sets[ex.id] : [];
  while (arr.length < setsFor(ex).length) arr.push({kg:null, reps:null});
  arr = arr.map(x => Object.assign({kg:null, reps:null}, x));
  s.sets[ex.id] = arr;
  return {s, arr, id};
}
function touch(id){
  const s = state.sessions[id]; if (s) s.updatedAt = new Date().toISOString();
  state.ver[id] = (state.ver[id] || 0) + 1;
  state.dirty.add(id);
  saveCache();
  schedule(id);
}
function setValue(exId, i, field, value){
  const ex = exOf(exId); if (!ex) return;
  const {arr, id} = ensureArr(ex);
  arr[i][field] = value;
  touch(id);
}
function toggleDone(exId, i){
  const ex = exOf(exId); if (!ex) return;
  const {s, arr, id} = ensureArr(ex);
  const set = arr[i];
  if (set.done){ set.done = false; delete s.finishedAt; touch(id); refresh(); return; }
  const dl = deloadNow();
  const prev = previous(exId); const p = prev ? (dl ? prev.arr[i+1] : prev.arr[i]) || null : null;
  if (set.kg == null && p && p.kg != null) set.kg = p.kg;
  if (set.reps == null && dl) set.reps = setsFor(ex)[i].goal;
  else if (set.reps == null && p && p.reps != null) set.reps = p.reps;
  if (set.kg == null || set.reps == null){
    const f = set.kg == null ? "kg" : "reps";
    const inp = main.querySelector(`input[data-ex="${exId}"][data-i="${i}"][data-f="${f}"]`);
    if (inp) inp.focus();
    return;
  }
  set.done = true;
  const now = new Date().toISOString();
  if (!s.startedAt) s.startedAt = now;
  s.lastDoneAt = now;
  const prog = dayProgress(s);
  if (prog.total && prog.done >= prog.total && !s.finishedAt){
    s.finishedAt = now;
    touch(id);
    refresh();
    stopTimer();
    openFinish();
    coachFeedback(id);
    return;
  }
  touch(id);
  refresh();
  startTimer(ex.restSec, ex.name);
}
/* pular um exercício hoje: o treino pode ser finalizado sem ele */
function toggleSkip(exId){
  const id = curId();
  let s = state.sessions[id];
  if (!s){ s = {date:isoToday(), workout:DAYS[state.day].workout || "extra", sets:{}}; state.sessions[id] = s; }
  const list = Array.isArray(s.skipped) ? s.skipped.slice() : [];
  const k = list.indexOf(exId);
  if (k >= 0) list.splice(k, 1); else list.push(exId);
  s.skipped = list;
  const prog = dayProgress(s);
  const complete = prog.total > 0 && prog.done >= prog.total && prog.done > 0;
  if (!complete && s.finishedAt) delete s.finishedAt;
  touch(id);
  refresh();
  if (complete && !s.finishedAt){
    s.finishedAt = new Date().toISOString();
    touch(id); refresh(); stopTimer(); openFinish(); coachFeedback(id);
  }
}
document.addEventListener("click", e => {
  if (state.view !== "treino" || !e.target.closest) return;
  const b = e.target.closest("[data-skip]");
  if (b && b.closest("#app")) toggleSkip(b.dataset.skip);
});
function dayProgress(sess){
  let total = 0, done = 0;
  const skip = new Set((sess && sess.skipped) || []);
  dayExercises().forEach(ex => {
    if (skip.has(ex.id)) return;
    const n = setsFor(ex).length; total += n;
    const arr = sess && sess.sets ? sess.sets[ex.id] : null;
    if (Array.isArray(arr)) arr.slice(0, n).forEach(x => { if (x && x.done) done++; });
  });
  return {total, done};
}

/* ---------- Gravação ---------- */
function schedule(id){
  clearTimeout(state.timers[id]); state.timers[id] = null;
  if (state.mode !== "db"){ if (state.mode === "local") setStatus("local"); return; }
  setStatus("saving");
  state.timers[id] = setTimeout(() => { state.timers[id] = null; flush(id, 0); }, 700);
}
async function flush(id, attempt){
  if (state.mode !== "db" || !state.col) return;
  if (state.writing[id]){ state.again[id] = true; return; }
  const s = state.sessions[id]; if (!s) return;
  const v = state.ver[id] || 0;
  state.writing[id] = true;
  let ok = false, retry = false;
  try{ await state.col.doc(id).set(JSON.parse(JSON.stringify(s))); ok = true; }
  catch(e){
    const code = e && e.code;
    if (code === "unavailable" && attempt === 0) retry = true;
    else if (code === "quota_exceeded") setStatus("full");
    else if (["invalid_argument","revoked","not_granted","capability_disabled","capability_removed","transform_error"].includes(code)) goLocal();
    else setStatus("offline");
  }finally{ state.writing[id] = false; }
  if (ok){
    if ((state.ver[id] || 0) === v){ state.dirty.delete(id); saveCache(); }
    if (!anyPending()) setStatus("saved");
  }
  if (retry){ setTimeout(() => flush(id, 1), 800 + Math.random() * 1200); return; }
  if (state.again[id]){ state.again[id] = false; flush(id, 0); }
}
function flushAllDirty(){ [...state.dirty].forEach(id => flush(id, 0)); }
function goLocal(){
  state.mode = "local"; state.col = null;
  if (state.idPending){ state.idPending = false; if (state.view === "treino") setTimeout(render, 0); }
  if (state.planPending){ state.planPending = false; if (state.view === "treino") setTimeout(render, 0); }
  if (state.unsub){ try{ state.unsub(); }catch(e){} state.unsub = null; }
  setStatus("local");
}
window.addEventListener("online", () => { if (state.mode === "db" && state.dirty.size) flushAllDirty(); });

function subscribe(){
  state.unsub = state.col.orderBy("date", "desc").limit(1000).onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { const v = d.data(); if (v) next[d.id] = JSON.parse(JSON.stringify(v)); });
    if (state.link && state.link.sessions){
      /* primeiro login neste aparelho: só sobe o que a nuvem não tem ou o que está mais novo aqui */
      state.link.sessions = false;
      state.dirty = new Set([...state.dirty].filter(id => state.sessions[id] && (!next[id] || (state.sessions[id].updatedAt || "") > (next[id].updatedAt || ""))));
    }
    state.dirty.forEach(id => { if (state.sessions[id]) next[id] = state.sessions[id]; });
    state.sessions = next; saveCache(); onData();
    if (!state.firstSnap){ state.firstSnap = true; if (state.dirty.size) flushAllDirty(); else setStatus("saved"); }
  }, err => {
    if (err && err.code === "unavailable" && !state.resubscribed){ state.resubscribed = true; setTimeout(subscribe, 2000); }
    else goLocal();
  });
}
/* onde os dados ficam: no Claude (artifact) ou na conta da nuvem (config.js); sem nenhum dos dois, só no aparelho */
function runtime(){
  const c = window.claude;
  if (c && typeof c.use === "function") return Promise.resolve(c);
  return window.fichaCloud ? window.fichaCloud.ready() : Promise.resolve(null);
}
async function connect(){
  const c = await runtime();
  if (!c || typeof c.use !== "function"){ goLocal(); updateAcctBtn(); return; }
  try{
    const cloud = !!c.cloud;
    const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
    const uid = user ? await user.id() : null;
    if (!db || !uid){ goLocal(); return; }
    state.col = db.doc(`data/users/${uid}/log`).collection("sessions");
    state.cfgRef = db.doc(`data/users/${uid}/config`);
    state.planRef = db.doc(`data/users/${uid}/plan`);
    state.rankCol = cloud ? null : db.collection("ranking");
    state.uid = uid; state.userCap = user; state.cloud = cloud; state.email = cloud ? user.email || "" : "";
    try{ state.isOwner = await user.isOwner(); }catch(e){ state.isOwner = false; }
    /* a cópia guardada no navegador é de outra conta? descarta antes de sincronizar */
    let prevOwner = null; try{ prevOwner = localStorage.getItem(OWNER_KEY); }catch(e){}
    const hadCache = Object.keys(state.sessions).length > 0 || !!state.plan || (chat.turns && chat.turns.length > 0);
    if ((prevOwner && prevOwner !== uid) || (!prevOwner && hadCache && !state.isOwner && !cloud)) resetLocalData();
    if (cloud && prevOwner !== uid) linkLocalData();
    try{ localStorage.setItem(OWNER_KEY, uid); }catch(e){}
    state.idPending = false;
    state.mode = "db";
    subscribe();
    subscribeCfg();
    subscribePlan();
    if (state.rankCol) subscribeRanking();
    updateAcctBtn();
    if (state.view === "treino") render();
  }catch(e){ goLocal(); updateAcctBtn(); }
}
/* primeiro login da conta na nuvem neste aparelho: os treinos, o plano e as configurações daqui vão junto.
   O que a nuvem já tiver prevalece (ver subscribe, subscribeCfg e subscribePlan). */
function linkLocalData(){
  Object.keys(state.sessions).forEach(id => state.dirty.add(id));
  if (!state.plan && loggedSessions().length){ const p = normalizePlan(JSON.parse(JSON.stringify(DEFAULT_PLAN))); if (p){ state.plan = p; applyPlan(p); } }
  state.planDirty = !!state.plan;
  state.cfgDirty = true;
  state.link = {sessions:true, plan:true, cfg:true};
  saveCache(); savePlanCache(); saveCfg();
}
const OWNER_KEY = "ficha-owner-v1";
function resetLocalData(){
  [CACHE_KEY, CFG_KEY, PLAN_KEY, CHAT_KEY].forEach(k => { try{ localStorage.removeItem(k); }catch(e){} });
  Object.values(state.timers || {}).forEach(t => clearTimeout(t));
  state.sessions = {}; state.dirty = new Set(); state.ver = {}; state.timers = {}; state.writing = {}; state.again = {};
  state.plan = null; state.planDirty = false; state.blank = false; state.planTemplate = false; state.planPending = true;
  applyPlan(DEFAULT_PLAN);

}

function estimateRange(){
  let lo = 0, hi = 0;
  dayExercises().forEach(ex => {
    const n = setsFor(ex).length;
    const work = (ex.sets[0].goal === 15 ? 50 : 45) * (ex.id === "puxada-unilateral" ? 2 : 1);
    const [rlo, rhi] = ex.restSec >= 150 ? [120, 180] : ex.restSec >= 75 ? [60, 90] : [60, 60];
    lo += n * work + (n - 1) * rlo + 90;
    hi += n * work + (n - 1) * rhi + 90;
  });
  return [Math.round(lo / 300) * 5, Math.round(hi / 300) * 5];
}
function fmtDuration(ms){
  const m = Math.max(0, Math.round(ms / 60000));
  if (m < 60) return `${m} min`;
  return `${Math.floor(m / 60)}h ${pad(m % 60)}min`;
}
function prevWorkoutVolume(){
  const w = DAYS[state.day].workout || "extra", cur = curId(); let best = null;
  for (const [id, x] of Object.entries(state.sessions)){
    if (id === cur || !x || x.workout !== w || x.deload || !x.sets) continue;
    if (!best || x.date > best.date) best = x;
  }
  if (!best) return null;
  let v = 0;
  Object.values(best.sets).forEach(arr => { if (Array.isArray(arr)) arr.forEach(y => { if (y && y.kg != null && y.reps != null) v += y.kg * y.reps; }); });
  return v || null;
}
function setRing(id, frac, color){
  const el = document.getElementById(id); if (!el) return;
  el.style.width = `${Math.max(0, Math.min(1, frac || 0)) * 100}%`;
  el.style.background = color || "";
}
function updateSummary(){
  const s = state.sessions[curId()];
  let total = 0, done = 0, vol = 0;
  const skip = new Set((s && s.skipped) || []);
  dayExercises().forEach(ex => {
    if (skip.has(ex.id)) return;
    total += setsFor(ex).length;
    const arr = s && s.sets ? s.sets[ex.id] : null;
    if (Array.isArray(arr)) arr.slice(0, setsFor(ex).length).forEach(x => { if (x && x.done){ done++; vol += (x.kg || 0) * (x.reps || 0); } });
  });
  let dur = 0;
  if (s && s.startedAt){
    const start = Date.parse(s.startedAt), last = Date.parse(s.lastDoneAt || s.startedAt);
    const end = s.finishedAt ? Date.parse(s.finishedAt) : (Date.now() - last < 30 * 60000 ? Date.now() : last);
    dur = end - start;
  }
  const fb = document.getElementById("finBanner");
  if (fb){
    const fin = total > 0 && done >= total;
    const at = s && s.finishedAt ? new Date(s.finishedAt) : null;
    fb.innerHTML = fin ? `<div class="banner fin"><b>Treino finalizado${at ? ` às ${pad(at.getHours())}:${pad(at.getMinutes())}` : ""}.</b> <button type="button" class="link" data-finish>Ver resumo</button></div>` : "";
  }
  const el = document.getElementById("sSets"); if (!el) return;
  el.textContent = String(done);
  document.getElementById("sSetsSub").textContent = `de ${total}`;
  setRing("rSets", total ? done / total : 0);
  const prev = prevWorkoutVolume();
  const vt = Math.round(vol);
  document.getElementById("sVol").textContent = vt >= 10000 ? `${(vt / 1000).toLocaleString("pt-BR", {maximumFractionDigits:1})} mil` : vt.toLocaleString("pt-BR");
  document.getElementById("sVolSub").textContent = prev ? `kg, ${Math.round(vol / prev * 100)}% do último` : "kg";
  setRing("rVol", prev ? vol / prev : (vol > 0 ? 1 : 0), prev && vol >= prev ? "var(--success)" : "");
  const mins = Math.max(0, Math.round(dur / 60000));
  const est = estimateRange(), mid = (est[0] + est[1]) / 2;

/* ---------- Cronômetro de descanso ---------- */
const timerEl = document.getElementById("timer");
const tTime = document.getElementById("tTime");
const tLabel = document.getElementById("tLabel");
const tProg = document.getElementById("tProg");
const tSkip = document.getElementById("tSkip");
let tState = null, actx = null;
function unlockAudio(){
  try{
    if (!actx){ const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
    if (actx && actx.state === "suspended") actx.resume();
  }catch(e){}
}
function beep(){
  try{
    if (!actx) return;
    const t = actx.currentTime;
    [0, 0.28].forEach(off => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t + off);
      g.gain.exponentialRampToValueAtTime(0.25, t + off + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + off + 0.2);
      o.connect(g); g.connect(actx.destination);
      o.start(t + off); o.stop(t + off + 0.22);
    });
  }catch(e){}
}
function startTimer(sec, name){
  stopTimer();
  tState = {end:Date.now() + sec * 1000, total:sec * 1000, name, done:false, iv:null};
  timerEl.hidden = false; timerEl.classList.remove("done");
  document.body.classList.add("timer-on");
  tSkip.textContent = "Pular";
  tick();
  tState.iv = setInterval(tick, 250);
}
function tick(){
  if (!tState) return;
  const ms = tState.end - Date.now();
  const rem = Math.max(0, Math.ceil(ms / 1000));
  tTime.textContent = `${Math.floor(rem / 60)}:${pad(rem % 60)}`;
  tProg.style.width = `${Math.max(0, Math.min(1, ms / tState.total)) * 100}%`;
  if (rem <= 0 && !tState.done){
    tState.done = true;
    timerEl.classList.add("done");
    tLabel.textContent = "Descanso concluído";
    tSkip.textContent = "Fechar";
    beep();
    try{ if (navigator.vibrate) navigator.vibrate([200, 100, 200]); }catch(e){}
  } else if (!tState.done){
    tLabel.textContent = `Descanso, ${tState.name}`;
  }
}
function adjust(delta){
  if (!tState || tState.done) return;
  tState.end = Math.max(Date.now(), tState.end + delta);
  if (delta > 0) tState.total += delta;
  tick();
}
function stopTimer(){ if (tState && tState.iv) clearInterval(tState.iv); tState = null; timerEl.hidden = true; document.body.classList.remove("timer-on"); }
document.getElementById("tMinus").addEventListener("click", () => adjust(-15000));
document.getElementById("tPlus").addEventListener("click", () => adjust(15000));
tSkip.addEventListener("click", stopTimer);

function esc(x){ return String(x).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function inl(x){ return esc(x).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"); }
function md(src){
  const lines = String(src).replace(/\r/g, "").split("\n");
  let out = "", list = null;
  const close = () => { if (list){ out += `</${list}>`; list = null; } };
  for (const raw of lines){
    const l = raw.trimEnd(); let m;
    if (!l.trim()){ close(); continue; }
    if ((m = l.match(/^\s*[-*•]\s+(.*)$/))){ if (list !== "ul"){ close(); out += "<ul>"; list = "ul"; } out += `<li>${inl(m[1])}</li>`; continue; }
    if ((m = l.match(/^\s*(\d+)[.)]\s+(.*)$/))){ if (list !== "ol"){ close(); out += "<ol>"; list = "ol"; } out += `<li>${inl(m[2])}</li>`; continue; }
    close();
    if ((m = l.match(/^#{1,6}\s+(.*)$/))){ out += `<p class="h">${inl(m[1])}</p>`; continue; }
    if (/^\s*\|/.test(l)){ const t = l.replace(/\|/g, " ").replace(/:?-{3,}:?/g, "").replace(/\s+/g, " ").trim(); if (t) out += `<p>${inl(t)}</p>`; continue; }
    out += `<p>${inl(l)}</p>`;
  }
  close();
  return out;
}

      const a = t.filter(m => m.r === "a").slice(-1).map(m => m.t.replace(/\s+/g, " ").slice(0, 280))[0] || "";
      return `${x.date} (${workoutName(x.workout)}): usuário: ${u || "—"}${a ? ` | personal: ${a}` : ""}`; });
  const pr = dayProgress(s);
  return `Agora você está no papel de personal virtual do usuário, dentro da ficha de treino. Fale como um bom personal: próximo, direto e motivador sem exagero, em frases curtas, em português do Brasil. Você conhece o plano, todas as cargas, as anotações e as conversas anteriores. Use os números dos registros quando ajudarem e lembre de problemas que ele já contou em outros dias. Responda em até 6 frases ou uma lista curta, a não ser que ele peça detalhes. Você não substitui médico nem fisioterapeuta: com dor forte, dor que piora ou não passa, ou sinais como urina escura, inchaço ou fraqueza incomum, oriente parar e procurar um médico.

Treino de hoje: ${fmtDate(s.date)} (${workoutName(s.workout)}), ${pr.done} de ${pr.total} séries feitas até agora.${(s.skipped || []).length ? ` Exercícios pulados hoje: ${(s.skipped || []).map(id => (exOf(id) || {}).name || id).join(", ")}.` : ""}

Conversas anteriores com o personal (mais recentes por último):
${past.length ? past.join("\n") : "Nenhuma."}`;
}
const FEEDBACK_REQ = "Acabei o treino de hoje. Comente como meu personal, em até 5 frases ou uma lista curta: o que foi bem (recordes, cargas e repetições que subiram), o que ajustar no próximo treino e, se eu contei algum problema hoje, como lidar com ele.";
function coachMessages(s, thread, internal){
  const t = thread.slice(-16);
  while (t.length && t[0].r !== "u" && t[0].k !== "feedback") t.shift();
  const msgs = [];
  let pending = contextTurn() + "\n\n" + coachPrompt(s);
  t.forEach(m => {
    if (m.r === "u"){ pending += "\n\n" + m.t; return; }
    if (m.k === "feedback") pending += "\n\n" + FEEDBACK_REQ;
    msgs.push({role:"user", content:pending.trim() || "(continuação)"}, {role:"assistant", content:m.t});
    pending = "";
  });
  if (internal) pending += "\n\n" + internal;
  msgs.push({role:"user", content:pending.trim() || "(continuação)"});
  return msgs;
}
async function runCoach(id, internal, kind){
  if (chat.off || coachAI.busy) return false;
  const fn = sampleFn || (sampleReady ? await sampleReady : null);
  if (!fn) return false;
  const s = state.sessions[id]; if (!s) return false;
  Object.assign(coachAI, {busy:true, sid:id, partial:"", err:"", errSid:null, kind, retry:null});
  const ctl = new AbortController(); coachAI.ctl = ctl;
  paintCoach();
  const add = text => {
    const m = {r:"a", t:text, at:new Date().toISOString()}; if (kind === "feedback") m.k = "feedback";
    setCoach(id, coachOf(state.sessions[id]).concat([m]));
  };
  let ok = false;
  try{
    const res = await fn(coachMessages(s, coachOf(s), internal), {
      cache:false, signal:ctl.signal,
      onText: ({text}) => { coachAI.partial = text; if (state.view === "treino" && curId() === id) paintCoach(); }
    });
    add(res.text); ok = true;
  }catch(e){
    const code = e && e.code;
    if (e && e.text && code !== "refused" && code !== "cancelled"){ add(e.text); ok = true; }
    else { coachAI.err = errCopy(code) || "Não foi possível responder agora."; coachAI.errSid = id; coachAI.retry = {internal, kind}; }
    if (HIDE_CODES.includes(code)) aiOff(code);
  }finally{
    coachAI.busy = false; coachAI.ctl = null; coachAI.partial = ""; coachAI.kind = null;
    if (state.view === "treino") paintCoach();
  }
  return ok;
}
function coachSend(text){
  text = String(text || "").trim().slice(0, 1500);
  if (!text || (coachAI.busy && !chat.off)) return;
  const id = curId();
  setCoach(id, coachOf(state.sessions[id]).concat([{r:"u", t:text, at:new Date().toISOString()}]));
  const box = document.getElementById("coachAsk"); if (box){ box.value = ""; autoGrow(box); }
  paintCoach();
  runCoach(id, null, null);
}
function coachFeedback(id){
  const s = state.sessions[id];
  if (!s || chat.off || s.coachFb) return;
  s.coachFb = true; touch(id);
  runCoach(id, FEEDBACK_REQ, "feedback");
}

function errCopy(code){
  switch (code){
    case "cancelled": return "";
    case "rate_limited": return "Muitas perguntas seguidas ou limite de uso atingido. Tente de novo em alguns minutos.";
    case "session_expired": return cloudOn() ? "Sua sessão expirou. Toque em Conta, no topo, saia e entre de novo." : "Sua sessão do Claude expirou. Entre de novo e volte aqui.";
    case "refused": return "Não foi possível responder a essa pergunta. Tente escrever de outro jeito.";
    case "prompt_too_large": return "A conversa ficou grande demais. Toque em Nova conversa e pergunte de novo.";
    case "empty_completion": return "A resposta veio vazia. Tente uma pergunta mais específica.";
    default:
      if (HIDE_CODES.includes(code)) return aiOffText();
      return "A resposta foi interrompida. Envie a pergunta de novo.";
  }
}

async function ask(q){
  q = String(q || "").trim();
  if (!q || chat.busy || chat.off) return;
  const box = document.getElementById("ask");
  if (box){ box.value = ""; autoGrow(box); }
  chat.note = ""; chat.noteErr = false;
  chat.turns.push({role:"user", content:q});
  chat.busy = true; chat.partial = "";
  saveChat(); renderThread(); scrollEnd();
  const fn = sampleFn || (sampleReady ? await sampleReady : null);
  if (!fn){ chat.busy = false; chat.off = true; renderThread(); updateComposer(); return; }
  const ctl = new AbortController(); chat.ctl = ctl;
  const hist = chat.turns.slice(-12);
  while (hist.length && hist[0].role !== "user") hist.shift();
  try{
    const res = await fn([{role:"user", content:contextTurn()}, ...hist], {
      cache:false, signal:ctl.signal,
      onText: ({text}) => {
        chat.partial = text;
        const live = document.getElementById("live");
        if (live) live.innerHTML = md(text);
      }
    });
    chat.turns.push({role:"assistant", content:res.text});
    if (res.truncated){ chat.note = "A resposta foi cortada no meio. Peça algo mais específico."; }
  }catch(e){
    const code = e && e.code;
    if (e && e.text && code !== "refused") chat.turns.push({role:"assistant", content:e.text + (code === "cancelled" ? "\n\n(resposta interrompida)" : "")});
    chat.note = errCopy(code); chat.noteErr = !!chat.note;
    if (HIDE_CODES.includes(code)) aiOff(code);
  }finally{
    chat.busy = false; chat.ctl = null; chat.partial = "";
    saveChat();
    if (chat.paywall && state.view === "analise"){ renderAnalysis(); return; }
    renderThread(); updateComposer();
  }
}

  const name = `backup-treino-${isoToday()}.json`;

function importBackup(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const c = JSON.parse(String(r.result));
      const incoming = c && c.sessions && typeof c.sessions === "object" ? c.sessions : null;
      if (!incoming) throw new Error("formato");
      let n = 0;
      for (const [id, x] of Object.entries(incoming)){
        if (!x || !x.date || !x.sets) continue;
        const cur = state.sessions[id];
        if (!cur || (x.updatedAt || "") >= (cur.updatedAt || "")){ state.sessions[id] = x; n++; }
      }
      if (c.config && typeof c.config === "object"){ applyCfg(c.config); applyAccent(); applyTheme(); saveCfg(); }
      const p = c.plan && normalizePlan(c.plan);
      if (p){ state.plan = p; applyPlan(p); savePlanCache(); }
      saveCache(); updateAnalysisStats(); updateFire();
      okNote("obnote", n ? `${n} ${n === 1 ? "treino importado" : "treinos importados"}.` : "Nada novo para importar.");
    }catch(e){ okNote("obnote", "Esse arquivo não é um backup da ficha.", true); }
  };
  r.onerror = () => okNote("obnote", "Não foi possível ler o arquivo.", true);
  r.readAsText(file);

function openFinish(){
  const s = state.sessions[curId()]; if (!s) return;
  const day = DAYS[state.day];
  const {total, done} = dayProgress(s);
  const skippedNames = (s.skipped || []).map(id => (exOf(id) || {}).name).filter(Boolean);
  let vol = 0; const prs = [], ups = [];
  const dl = deloadNow();
  dayExercises().forEach(ex => {
    const arr = s.sets ? s.sets[ex.id] : null; if (!Array.isArray(arr)) return;
    const used = arr.slice(0, setsFor(ex).length).filter(x => x && x.done);
    used.forEach(x => { vol += (x.kg || 0) * (x.reps || 0); });
    const best = bestKgBefore(ex.id);
    const top = used.length ? Math.max(...used.map(x => x.kg || 0)) : null;
    if (best != null && top != null && top > best) prs.push(`${ex.name}: <b>${fmtKg(top)} kg</b> (antes ${fmtKg(best)} kg)`);
    if (!dl){ const p = progression(ex, arr); if (p && p.kind === "up") ups.push(`${ex.name}: <b>${fmtKg(p.kg)} kg</b> (+${fmtKg(p.add)} kg)`); }
  });
  const prevVol = prevWorkoutVolume();
  const start = s.startedAt ? Date.parse(s.startedAt) : null, end = s.finishedAt ? Date.parse(s.finishedAt) : Date.now();
  const mins = start ? Math.max(1, Math.round((end - start) / 60000)) : 0;
  const streak = streakInfo().current;
  const vt = Math.round(vol).toLocaleString("pt-BR");
  document.getElementById("finishBody").innerHTML = `<div class="grab"></div>
    <div class="fin-badge">${ICON_CHECK}</div>
    <h2 id="finTitle">Treino finalizado</h2>
    <p class="sub">${esc(dayTitle(day))}, ${fmtDate(s.date)}${dl ? ", semana leve" : ""}</p>
    ${skippedNames.length ? `<p class="sub fin-skip">Pulado hoje: ${esc(skippedNames.join(", "))}</p>` : ""}
    <div class="fin-grid">
      <div><span>Tempo</span><b>${mins ? `${mins} min` : "—"}</b></div>
      <div><span>Volume</span><b>${vt} kg</b>${prevVol ? `<small>${Math.round(vol / prevVol * 100)}% do último</small>` : ""}</div>
      <div><span>Séries</span><b>${done} de ${total}</b></div>
      <div><span>Recordes</span><b>${prs.length}</b></div>
    </div>
    ${prs.length ? `<div class="box"><b>Recordes de carga</b><ul>${prs.map(x => `<li>${x}</li>`).join("")}</ul></div>` : ""}
    ${ups.length ? `<div class="box"><b>No próximo treino, suba a carga</b><ul>${ups.map(x => `<li>${x}</li>`).join("")}</ul></div>` : ""}
    ${streak ? `<div class="fin-fire">${fireSVG(true, 30)}<span><b>${streak} ${streak === 1 ? "dia seguido" : "dias seguidos"}</b> no foguinho</span></div>` : ""}
    ${chat.off ? "" : `<p class="fin-coach">${ICON_COACH}<span>Seu personal está comentando o treino. Veja no fim da página.</span></p>`}
    <button type="button" class="btn-close" data-close>Fechar</button>`;
  document.getElementById("finishSheet").hidden = false;
}

function bestKgUntil(exId, iso){
  let best = null;
  loggedSessions().forEach(x => { if (x.date >= iso || x.deload || !x.sets) return; const k = maxHeavyKg(x.sets[exId], exId); if (k != null && (best == null || k > best)) best = k; });
  return best;
}
function openDaySummary(iso){

  const body = document.getElementById("finishBody");

function daysBetween(a, b){ return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
function streakInfo(){
  const today = isoToday(), month = today.slice(0, 7);
  const loggedDates = new Set(loggedSessions().map(s => s.date));
  const restores = state.config.restores || [];
  const restored = new Set(restores.map(r => r.date));
  const used = restores.filter(r => r.usedAt === month).length;
  const info = {current:0, best:0, today, loggedToday:loggedDates.has(today), pending:false, gap:[], prevChain:0, left:Math.max(0, 3 - used), used, canRestore:false};
  if (!loggedDates.size) return info;
  const first = [...loggedDates].sort()[0];
  let run = 0, started = false, best = 0, gap = [], prevChain = 0;
  for (let d = first; d <= today; d = addDays(d, 1)){
    const weekend = isRestDate(d);
    if (loggedDates.has(d)){ run++; started = true; }
    else if (weekend || restored.has(d)){ if (started) run++; }
    else if (d === today){ info.pending = true; }
    else { if (started){ prevChain = run; gap = [d]; } else gap.push(d); run = 0; started = false; }
    if (run > best) best = run;
  }
  info.current = run; info.best = best; info.gap = gap; info.prevChain = prevChain;
  const lastMiss = gap.length ? gap[gap.length - 1] : null;
  info.canRestore = !!lastMiss && prevChain > 0 && gap.length <= info.left && daysBetween(lastMiss, today) <= 7;
  return info;
}

function yearHTML(year, byDate, today){

  const best = streakInfo().best;
  let months = "";
  for (let m = 0; m < 12; m++){
    const first = new Date(year, m, 1, 12);
    const lead = (first.getDay() + 6) % 7;
    const nDays = new Date(year, m + 1, 0).getDate();
    let cells = "", count = 0;
    for (let i = 0; i < lead; i++) cells += `<i class="yd empty"></i>`;
    for (let d = 1; d <= nDays; d++){
      const iso = `${ys}-${pad(m + 1)}-${pad(d)}`;
      const wd = (lead + d - 1) % 7;
      const sess = byDate[iso];
      let cls = "yd" + (wd >= 5 ? " we" : "");

/* ---------- Calendário ---------- */
function weekCard(m, cur, today, byDate, nd){
  const deload = state.config.deloadWeeks.includes(m);
  const suggested = !deload && !nd.planned && nd.week === m;
  const cls = ["week"];
  if (m === cur) cls.push("current");
  if (deload) cls.push("deload");
  const restoredSet = new Set((state.config.restores || []).map(r => r.date));
  const idxs = DAYS.map((d, i) => i).filter(i => i < 5 || dayPlanned(i) || (byDate[addDays(m, i)] || []).length || restoredSet.has(addDays(m, i)));
  const days = idxs.map(i => {
    const d = DAYS[i];
    const iso = addDays(m, i);
    const sess = byDate[iso] || [];
    const done = sess.length > 0;
    if (!done && restoredSet.has(iso)) return `<div class="day restored" data-iso="${iso}" role="button" tabindex="0"><span class="dl">${d.label}</span><span class="dw">Restaurado</span><span class="ds">${fireSVG(true, 14)}</span></div>`;
    const wname = done ? sess.map(s => workoutName(s.workout)).join(" + ") : dayName(d);
    const st = done ? "done" : isRestDate(iso) ? "rest" : iso < today ? "miss" : iso === today ? "today" : "next";
    return `<div class="day ${st}"${iso <= today ? ` data-iso="${iso}" role="button" tabindex="0"` : ""}><span class="dl">${d.label}</span><span class="dw">${esc(wname)}</span><span class="ds">${done ? ICON_CHECK : ""}</span></div>`;
  }).join("");
  const tags = (m === cur ? `<span class="wtag">Esta semana</span>` : "") + (suggested ? `<span class="wtag sug">Sugerida para semana leve</span>` : "");
  return `<article class="${cls.join(" ")}" data-wk="${m}">
    <div class="wk-head"><div><b>${fmtDate(m)} a ${fmtDate(addDays(m, 6))}</b>${tags}</div>
      <button type="button" class="switch" role="switch" aria-checked="${deload}" data-week="${m}"><span>Semana leve</span><i></i></button></div>
    <div class="days" style="grid-template-columns:repeat(${idxs.length},minmax(0,1fr))">${days}</div>
  </article>`;
}
function renderCalendar(keepScroll){
  const y = window.scrollY;
  main.classList.add("chat");
  tabsEl.hidden = true;
  const today = isoToday(), cur = mondayOf(today);
  const nd = nextDeload(), inDeload = deloadNow();
  const byDate = {};
  loggedSessions().forEach(s => { (byDate[s.date] = byDate[s.date] || []).push(s); });
  const logged = loggedSessions();
  let start = logged.length ? mondayOf(logged[0].date) : cur;
  if (start < addDays(cur, -56)) start = addDays(cur, -56);
  let end = addDays(cur, 56);
  if (nd.week > end) end = nd.week;
  const weeks = [];
  for (let m = start; m <= end; m = addDays(m, 7)) weeks.push(m);
  let html = `<section class="summary">
      <h2>Calendário</h2>
      <p class="when">Seus treinos semana a semana. Use o botão de cada semana para marcar ou desmarcar a semana leve.</p>
      <div class="stats">
        <div class="stat"><span>Semana do ciclo</span><strong class="num">${inDeload ? "Leve" : `${Math.min(cycleWeek(), 99)} de ${state.config.cycle}`}</strong></div>
        <div class="stat"><span>Próxima leve</span><strong class="num">${fmtDate(nd.week)}</strong></div>
        <div class="stat"><span>Treinos feitos</span><strong class="num">${Object.keys(byDate).length}</strong></div>
      </div>
      <div class="cycle"><span>Semana leve a cada</span><div class="seg2">${[6, 8].map(n => `<button type="button" data-cycle="${n}" aria-pressed="${state.config.cycle === n}">${n} semanas</button>`).join("")}</div></div>
    </section>`;
  html += yearHTML(state.calYear || +today.slice(0, 4), byDate, today);
  html += `<h3 class="section">Semanas</h3>`;
  html += weeks.map(m => weekCard(m, cur, today, byDate, nd)).join("");
  html += `<section class="rules"><h3>Na semana leve</h3><ul>
    <li>Todos os treinos da semana ficam com <b>2 séries</b> por exercício.</li>
    <li>Use a <b>mesma carga</b> das séries pesadas e pare <b>2 a 3 repetições antes da falha</b>.</li>
    <li>A ficha não sugere aumento de carga nessa semana, e esses treinos não entram como "Anterior" nas semanas seguintes.</li>
  </ul></section>`;
  main.innerHTML = html;
  if (keepScroll) window.scrollTo({top:y});
  else window.scrollTo({top:0});
}

/* ---------- Plano: salvar e sincronizar ---------- */
const PLAN_KEY = "ficha-plan-v1";
state.plan = null; state.planTemplate = false; state.planRef = null; state.planDirty = false; state.planWriting = false; state.planAgain = false;
function loadPlanCache(){
  try{
    const c = JSON.parse(localStorage.getItem(PLAN_KEY) || "null");
    const p = c && normalizePlan(c.plan);
    if (p){ state.plan = p; applyPlan(p); state.planDirty = !!c.dirty; }
  }catch(e){}
}
function savePlanCache(){ try{ localStorage.setItem(PLAN_KEY, JSON.stringify({plan:state.plan, dirty:state.planDirty})); }catch(e){} }
async function writePlan(){
  state.planDirty = true; savePlanCache();
  if (state.mode !== "db" || !state.planRef || !state.plan) return;
  if (state.planWriting){ state.planAgain = true; return; }
  state.planWriting = true; setStatus("saving");
  try{
    await state.planRef.set(JSON.parse(JSON.stringify(state.plan)));
    if (!state.planAgain){ state.planDirty = false; savePlanCache(); }
    if (!anyPending()) setStatus("saved");
  }catch(e){ setStatus(e && e.code === "quota_exceeded" ? "full" : "offline"); }
  finally{ state.planWriting = false; if (state.planAgain){ state.planAgain = false; writePlan(); } }
}
function subscribePlan(){
  state.planRef.onSnapshot(snap => {
    state.planPending = false;
    if (state.link && state.link.plan){ state.link.plan = false; if (snap.exists && !state.planWriting){ state.planDirty = false; savePlanCache(); } }
    if (state.planDirty || state.planWriting){ writePlan(); onPlanChanged(); return; }
    if (snap.exists){
      const p = normalizePlan(snap.data());
      if (p){ state.plan = p; applyPlan(p); state.planTemplate = false; state.blank = false; savePlanCache(); }
    } else if (!state.plan){
      /* usuário novo (sem plano salvo e sem treinos): começa do zero; o dono continua com o plano dele */
      if (!state.isOwner && !loggedSessions().length){ state.blank = true; state.planTemplate = false; applyPlan(BLANK_PLAN); }
      else { state.blank = false; state.planTemplate = !state.isOwner; applyPlan(DEFAULT_PLAN); }
    }
    onPlanChanged();
  }, () => { state.planPending = false; onPlanChanged(); });
}
function onPlanChanged(){
  if (state.view === "treino") render();
  else if (state.view === "calendario") renderCalendar(true);
  else if (state.view === "analise") updateAnalysisStats();
  updateFire();
}

let edKey = 0;
const newEdKey = () => "k" + (++edKey);
function keyDraft(d){
  Object.values(d.workouts).forEach(w => w.exercises.forEach(e => { if (!e._k) e._k = newEdKey(); }));
  d.extra.exercises.forEach(e => { if (!e._k) e._k = newEdKey(); });
}
const SCHEME_LABEL = {A:"composto", B:"isolado", P:"pirâmide invertida"};
const REST_LABEL = {heavy:"2–3 min", light:"1–1,5 min", short:"1 min"};
/* séries semanais de cada músculo no rascunho (cada exercício conta para os músculos principais dele) */
function draftVolume(d){
  const count = {}; MUSCLES.forEach(m => { count[m.id] = 0; });
  const unknown = [];
  const times = {};
  d.days.forEach(x => { if (x.workout) times[x.workout] = (times[x.workout] || 0) + 1; });
  const extraTimes = d.days.filter(x => x.extra).length;
  const addEx = (e, n) => {
    const name = String(e.name || "").trim(); if (!name || !n) return;
    const info = exInfo(e.id || "", name);
    if (!info){ if (!unknown.includes(name)) unknown.push(name); return; }
    info.m.forEach(mid => { if (mid in count) count[mid] += (+e.sets || 0) * n; });
  };
  Object.entries(d.workouts).forEach(([k, w]) => w.exercises.forEach(e => addEx(e, times[k] || 0)));
  d.extra.exercises.forEach(e => addEx(e, extraTimes));
  return {count, unknown};
}
function edVolHTML(){
  const d = state.draft; if (!d) return "";
  const {count, unknown} = draftVolume(d);
  const max = Math.max(20, ...Object.values(count));
  const rows = MUSCLES.slice().sort((a, b) => count[b.id] - count[a.id]).map(m => {
    const n = count[m.id];
    const cls = n === 0 ? "ev-zero" : n < 8 ? "ev-low" : n > 24 ? "ev-high" : "ev-fine";
    return `<div class="ev-row ${cls}"><span>${m.name}</span><span class="ev-bar"><i style="width:${Math.round(Math.min(n, max) / max * 100)}%"></i></span><b>${n}</b></div>`;
  }).join("");
  return `<h3>Séries por semana</h3>
    <div class="ev-list">${rows}</div>
    <p class="mini">Para crescer, 10 a 20 séries por semana por músculo costumam funcionar bem. A conta usa o nome de cada exercício e os dias em que ele aparece.${unknown.length ? ` Não reconhecidos: ${esc(unknown.slice(0, 4).join(", "))}${unknown.length > 4 ? "…" : ""}.` : ""}</p>`;
}

function draftPlanText(d){
  const out = [];
  DAYS.forEach((day, i) => {
    const x = d.days[i] || {};
    const w = x.workout && d.workouts[x.workout];
    const parts = [w ? (w.name || "Treino") : null, x.extra && d.extra.exercises.length ? (d.extra.name || "Complemento") : null].filter(Boolean);
    out.push(`${day.full}: ${parts.length ? parts.join(" + ") : "Descanso"}`);
  });
  const exLine = (e, i) => `${i + 1}. ${String(e.name || "").trim() || "(sem nome)"} (${SCHEME_LABEL[e.scheme] || "composto"}, ${e.sets} séries, descanso ${REST_LABEL[e.rest] || "1–1,5 min"})`;

  return out.join("\n");
}

async function runEd(){
  if (chat.off) return;
  const fn = sampleFn || (sampleReady ? await sampleReady : null);
  if (!fn){ edCoach.err = proOffer() ? aiOffText() : "O personal só responde na versão da ficha publicada no Claude."; paintEdCoach(); return; }
  if (edCoach.ctl){ try{ edCoach.ctl.abort(); }catch(e){} }
  const ctl = new AbortController(); edCoach.ctl = ctl;
  Object.assign(edCoach, {busy:true, partial:"", err:""});
  paintEdCoach();
  try{
    const res = await fn(edMsgs(), {cache:false, signal:ctl.signal, onText: ({text}) => { if (edCoach.ctl !== ctl) return; edCoach.partial = text; paintEdCoach(); }});
    if (edCoach.ctl !== ctl) return;
    edCoach.thread.push({r:"a", t:res.text});
  }catch(e){
    if (edCoach.ctl !== ctl) return;
    const code = e && e.code;
    if (e && e.text && code !== "refused" && code !== "cancelled") edCoach.thread.push({r:"a", t:e.text});
    else if (code !== "cancelled" && !(e && e.name === "AbortError")) edCoach.err = errCopy(code) || "Não foi possível responder agora.";

  }finally{
    if (edCoach.ctl === ctl){ edCoach.busy = false; edCoach.ctl = null; edCoach.partial = ""; paintEdCoach(); }
  }
}

state.ranking = {}; state.rankMetric = "streak"; state.rankCol = null;
function evolutionPct(){
  const first = {}, last = {};
  loggedSessions().filter(s => !s.deload).forEach(s => {
    Object.entries(s.sets || {}).forEach(([id, arr]) => {
      const kg = maxHeavyKg(arr, id); if (kg == null || kg <= 0) return;
      if (!(id in first)) first[id] = {kg, date:s.date};
      last[id] = {kg, date:s.date};
    });
  });
  const vals = Object.keys(first).filter(id => last[id].date > first[id].date).map(id => (last[id].kg - first[id].kg) / first[id].kg * 100);
  return vals.length ? Math.round(vals.reduce((a, b) => a + b, 0) / vals.length) : 0;
}
function myStats(){
  const info = streakInfo(), today = isoToday(), month = today.slice(0, 7);
  const logged = loggedSessions();
  const dates = new Set(logged.map(s => s.date));
  const restored = new Set((state.config.restores || []).map(r => r.date));
  let planned = 0, hit = 0;
  const first = logged.length ? logged[0].date : today;
  for (let i = 1; i <= 28; i++){
    const d = addDays(today, -i); if (d < first) break;
    if (isRestDate(d)) continue;
    planned++; if (dates.has(d) || restored.has(d)) hit++;
  }
  if (dates.has(today) && !isRestDate(today)){ planned++; hit++; }
  return {streak:info.current, best:info.best, month:[...dates].filter(d => d.startsWith(month)).length, monthKey:month, freq:planned ? Math.round(hit / planned * 100) : 0, evo:evolutionPct(), loads:state.config.shareLoads ? myLoads() : null, shape:state.config.shareShape ? myShapeShare() : null};
}
/* melhor série pesada do treino mais recente de cada exercício (só com "Mostrar minhas cargas") */
function myLoads(){
  const out = {};
  loggedSessions().filter(s => !s.deload).forEach(s => {
    Object.entries(s.sets || {}).forEach(([id, arr]) => {
      let b = null;
      heavyPart(id, arr).forEach(x => { if (x && x.kg > 0 && x.reps > 0){ const e = e1rm(x.kg, x.reps); if (!b || e > b.e) b = {kg:x.kg, reps:x.reps, e}; } });
      if (b) out[id] = {kg:b.kg, reps:b.reps, e:Math.round(b.e * 10) / 10, d:s.date, n:(EX_INDEX[id] || {}).name || id};
    });

  const keys = Object.keys(out).slice(0, 40), res = {};
  keys.forEach(k => { res[k] = out[k]; });
  return res;
}

function exInfo(id, name){

}

  const o = Object.assign({}, AVATAR_DEFAULT);

  if (hex(a.hairColor)) o.hairColor = a.hairColor;

function tierOf(r){
  let i = 0; TIERS.forEach((t, k) => { if (r >= t.min) i = k; });
  const lo = TIERS[i].min, hi = i < TIERS.length - 1 ? TIERS[i + 1].min : lo + 0.3;

    heavyPart(id, arr).forEach(x => {
      if (!x || !(x.kg > 0) || !(x.reps > 0)) return;
      const e = e1rm(x.kg, Math.min(x.reps, 20));
      if (!best[id] || e > best[id].e) best[id] = {e, kg:x.kg, reps:x.reps, date:s.date};

function nextTarget(v){
  if (!v) return null;
  const bw = bodyWeight(); if (!bw) return null;
  let boundary, label;
  if (v.sub < 3){ boundary = v.lo + v.sub / 3 * (v.hi - v.lo); label = `${TIERS[v.i].name} ${ROMAN[v.sub + 1]}`; }
  else if (v.i < TIERS.length - 1){ boundary = v.hi; label = `${TIERS[v.i + 1].name} I`; }
  else return null;
  const ex = EX_INDEX[v.ex];
  const goal = ex ? ex.sets[heavyIdx(ex)[0] != null ? heavyIdx(ex)[0] : 0].goal : 8;
  const raw = boundary * bw * v.std / (1 + goal / 30);
  const step = raw < 20 ? 0.5 : 1;
  return {label, kg:Math.ceil(raw / step) * step, reps:goal};
}
function overallRank(ranks){
  const v = Object.values(ranks).filter(Boolean);
  if (!v.length) return null;
  const avg = v.reduce((a, x) => a + x.i + x.frac, 0) / v.length;
  const i = Math.min(TIERS.length - 1, Math.floor(avg));
  return {i, sub:Math.min(3, Math.floor((avg - i) * 3) + 1), count:v.length};
}

/* ---- girar: frente, lado, costas e o outro lado, com transição entre as vistas ---- */
const FACES = [["front", 0], ["side", 90], ["back", 180], ["side2", 270]];
function faceWeights(deg){
  const w = {};
  FACES.forEach(([k, a]) => { const d = Math.abs((((deg - a) % 360) + 540) % 360 - 180); w[k] = Math.max(0, Math.cos(d * Math.PI / 180)); });
  return w;
}
function paintTurn(animate){
  const w = faceWeights(shape.rot);
  let best = "front", bw = -1;
  Object.entries(w).forEach(([k, v]) => { if (v > bw){ bw = v; best = k; } });
  shape.face = best;
  main.querySelectorAll(".bm-face").forEach(f => {
    const k = f.dataset.face, v = w[k] || 0;
    const op = Math.min(1, Math.max(0, (v - 0.35) / 0.5));
    const sx = (0.55 + 0.45 * v) * (k === "side2" ? -1 : 1);
    f.style.transition = animate ? "opacity .35s ease, transform .35s ease" : "none";
    f.style.opacity = op.toFixed(3);
    f.style.transform = `scaleX(${sx.toFixed(3)})`;
    f.style.pointerEvents = k === best ? "auto" : "none";
    f.style.zIndex = k === best ? "2" : "1";
  });
  const cur = best === "side2" ? "side" : best;
  main.querySelectorAll("[data-turn]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.turn === cur)));
}
function setRot(deg, animate){ shape.rot = deg; paintTurn(animate); }
function turnTo(face){
  const target = {front:0, side:90, back:180}[face] || 0;
  setRot(Math.round((shape.rot - target) / 360) * 360 + target, true);
}
function faceTo(back){ if ((shape.face === "back") !== back) turnTo(back ? "back" : "front"); }
function bindRotate(){
  const st = document.getElementById("bodyMap"); if (!st) return;
  st.addEventListener("pointerdown", e => {
    if (e.button != null && e.button !== 0) return;
    shape.drag = {x:e.clientX, y:e.clientY, rot:shape.rot, active:false, id:e.pointerId};
  });
  st.addEventListener("pointermove", e => {
    const d = shape.drag; if (!d) return;
    const dx = e.clientX - d.x, dy = e.clientY - d.y;
    if (!d.active){
      if (Math.abs(dx) < 6 || Math.abs(dx) < Math.abs(dy)) return;
      d.active = true;
      try{ st.setPointerCapture(d.id); }catch(err){}
    }
    e.preventDefault();
    setRot(d.rot + dx * 0.7, false);
  });
  const end = () => {
    const d = shape.drag; shape.drag = null;
    if (!d || !d.active) return;
    shape.justDragged = true; setTimeout(() => { shape.justDragged = false; }, 60);
    setRot(Math.round(shape.rot / 90) * 90, true);
  };
  st.addEventListener("pointerup", end);
  st.addEventListener("pointercancel", end);
  st.addEventListener("lostpointercapture", e => { if (e.target === st) end(); });
}

  return `<button type="button" class="mrow${shape.sel === m.id && !shape.part ? " on" : ""}" data-row="${m.id}">
    <span class="mdot" style="background:${color}"></span>
    <span class="mname"><b>${m.name}</b><small>${v ? `${esc(v.exName)}: ${fmtKg(v.b.kg)} kg × ${v.b.reps}` : bodyWeight() ? "Sem registro ainda" : "Informe seu peso"}</small></span>
    <span class="mtier" style="color:${v ? color : "var(--text-2)"}">${v ? tierLabel(v) : "—"}</span>
    ${v ? `<span class="mbar"><i style="width:${Math.max(4, Math.round(v.frac * 100))}%;background:${color}"></i></span>` : ""}
    ${nx ? `<small class="mnext">Para ${nx.label}: ${fmtKg(nx.kg)} kg × ${nx.reps}</small>` : ""}
  </button>`;
}
function compareHTML(mine, theirs, uid){
  let me = 0, them = 0;
  const score = v => v ? v.i + v.frac : -1;
  const rows = MUSCLES.map(m => {
    const a = mine[m.id], b = theirs[m.id];
    const diff = score(a) - score(b);
    if (a || b){ if (diff > 0.02) me++; else if (diff < -0.02) them++; }
    const cell = v => `<span class="cmp-t" style="color:${v ? TIERS[v.i].color : "var(--text-2)"}">${v ? tierLabel(v) : "—"}</span>`;
    const mark = !a && !b ? "" : diff > 0.02 ? `<span class="cmp-m up" title="Você na frente">▲</span>` : diff < -0.02 ? `<span class="cmp-m down" title="${esc(nameOf(uid))} na frente">▼</span>` : `<span class="cmp-m">=</span>`;
    return `<button type="button" class="cmp-row" data-row="${m.id}"><span class="cmp-n">${m.name}</span>${cell(a)}${cell(b)}${mark}</button>`;
  }).join("");
  return `<div class="cmp-sum">Você está à frente em <b>${me}</b> ${me === 1 ? "músculo" : "músculos"}; <span data-name-uid="${esc(uid)}">${esc(nameOf(uid))}</span>, em <b>${them}</b>.</div>
    <div class="cmp-list"><div class="cmp-h"><span>Músculo</span><span>Você</span><span data-name-uid="${esc(uid)}">${esc(nameOf(uid))}</span><span></span></div>${rows}</div>`;
}
function renderShape(){

  main.innerHTML = `<section class="summary shape-head"><h2>Shape</h2><p class="when">Cada músculo ganha a cor da patente conforme as cargas. Arraste para girar e toque numa porção para ver os melhores exercícios.</p></section>
    ${who}
    <div class="bm-top">
      <div class="shape-overall">${fr ? `<small class="who-l">Shape de <span data-name-uid="${esc(fr.uid)}">${esc(nameOf(fr.uid))}</span></small>` : ""}${all ? `<span class="badge" style="--tc:${TIERS[all.i].color}">${TIERS[all.i].name} ${ROMAN[all.sub]}</span><small>Nível geral · ${all.count} ${all.count === 1 ? "músculo" : "músculos"}</small>` : `<span class="badge none">Sem patente</span><small>${fr ? "Ainda sem registros" : bw ? "Registre treinos para ganhar patentes" : "Informe seu peso abaixo"}</small>`}</div>

        <div class="bm-face" data-face="back">${bodyViewSVG(BODY_BACK, col, "costas")}</div>

    ${fr ? compareHTML(mine, ranks, fr.uid) : `
    ${askW ? `<div class="panel shape-weight"><b>Qual é o seu peso?</b><p class="mini">As patentes comparam a sua força com o seu peso corporal.</p><div class="actions"><input class="ed-in" id="shapeW" type="number" inputmode="decimal" min="30" max="250" step="0.5" value="${bw || ""}" placeholder="kg" aria-label="Peso corporal em kg"><button type="button" class="btn primary" data-shape-w>Salvar</button></div></div>`
      : `<p class="bm-weight">Peso usado no cálculo: <b>${fmtKg(bw)} kg</b> <button type="button" class="link" data-shape-editw>Alterar</button></p>`}
    <div class="mlist">${order.map(m => shapeRowHTML(m, mine[m.id])).join("")}</div>`}
    ${!friends.length && state.mode === "db" ? `<p class="mini shape-note">Para comparar com amigos, eles precisam ativar <b>Mostrar meu shape</b> na aba Ranking.</p>` : ""}

  bindRotate();

function partCardHTML(id, part){
  const fr = shape.cmp ? shapeFriends().find(f => f.uid === shape.cmp) : null;
  const ranks = fr ? ranksFromShape(fr.shape) : muscleRanks();
  const mine = fr ? muscleRanks() : null;
  const pillFor = (v, label) => `<span class="pc-pill" style="--tc:${v ? TIERS[v.i].color : "var(--text-2)"}">${label}${tierLabel(v)}</span>`;
  const pills = id ? (fr ? pillFor(mine[id], "Você · ") + pillFor(ranks[id], `${nameOf(fr.uid)} · `) : pillFor(ranks[id], `${MUSCLES.find(x => x.id === id).name} · `)) : `<span class="pc-pill">Sem exercício no seu treino</span>`;
  if (part){

      return `<li><div class="pc-ex"><b>${esc(n)}</b>${inPlan(key) ? `<span class="pc-tag">No seu treino</span>` : ""}</div>

        <small>${also && also !== "—" ? `Também trabalha: ${esc(also)}` : "Praticamente só essa região"}</small></li>`; }).join("") : "";

    <div class="chips pc-parts">${groupParts(id).map(p => `<button type="button" class="chip" data-pc-part="${esc(p)}" data-pc-id="${id}">${esc(p.replace(/^[^:]+: /, ""))}</button>`).join("")}</div>
    <button type="button" class="link pc-close" data-pc-close>Fechar</button>`;
}
/* id = grupo muscular; part = porção tocada (ou músculo sem patente) */
function selectMuscle(id, part, turn){
  shape.sel = id; shape.part = part || null;
  main.querySelectorAll(".bm-m").forEach(p => p.classList.toggle("sel", part ? p.dataset.part === part : !!id && p.dataset.muscle === id));
  main.querySelectorAll(".mrow, .cmp-row").forEach(b => b.classList.toggle("on", !part && b.dataset.row === id));
  const tip = document.getElementById("shapeTip"), card = document.getElementById("partCard");
  if (!id && !part){ if (tip) tip.hidden = true; if (card) card.hidden = true; return; }
  if (turn && id){ const m = MUSCLES.find(x => x.id === id); if (m) faceTo(m.back); }
  if (tip){
    tip.hidden = false;
    const fr = shape.cmp ? shapeFriends().find(f => f.uid === shape.cmp) : null;
    const ranks = fr ? ranksFromShape(fr.shape) : muscleRanks();
    if (!id) tip.innerHTML = `<span class="mdot" style="background:var(--bm-muscle)"></span><b>${esc(part)}</b>`;
    else { const m = MUSCLES.find(x => x.id === id), v = ranks[id]; tip.innerHTML = `<span class="mdot" style="background:${v ? TIERS[v.i].color : NO_RANK}"></span><b>${m.name}</b><span>${tierLabel(v)}</span>`; }
  }
  if (card){ card.hidden = false; card.innerHTML = partCardHTML(id, part); }
}
function saveWeight(val){
  const w = parseFloat(String(val || "").replace(",", "."));
  if (!(w >= 30 && w <= 250)) return false;
  state.config.avatar = cleanAvatar(Object.assign(avatar(), {weight:w}));
  writeCfg();
  return true;
}
main.addEventListener("click", e => {
  if (state.view !== "shape") return;
  if (shape.justDragged) return;
  if (e.target.closest("[data-shape-w]")){ const i = document.getElementById("shapeW"); if (i && saveWeight(i.value)){ shape.editW = false; renderShape(); } return; }
  if (e.target.closest("[data-shape-editw]")){ shape.editW = true; renderShape(); const i = document.getElementById("shapeW"); if (i) i.focus(); return; }
  const w = e.target.closest("[data-who]"); if (w){ shape.cmp = w.dataset.who || null; renderShape(); return; }
  const t = e.target.closest("[data-turn]"); if (t){ turnTo(t.dataset.turn); return; }
  if (e.target.closest("[data-pc-close]")){ selectMuscle(null, null); return; }
  const pc = e.target.closest("[data-pc-part]"); if (pc){ selectMuscle(pc.dataset.pcId, pc.dataset.pcPart); return; }
  const row = e.target.closest(".mrow, .cmp-row");
  if (row){ const same = shape.sel === row.dataset.row && !shape.part; selectMuscle(same ? null : row.dataset.row, null, true); if (!same) window.scrollTo({top:0, behavior:"smooth"}); return; }
  const m = e.target.closest(".bm-m");
  if (m){ const id = m.dataset.muscle || null, part = m.dataset.part; const same = shape.part === part; selectMuscle(same ? null : id, same ? null : part); if (!same){ const c = document.getElementById("partCard"); if (c) setTimeout(() => c.scrollIntoView({block:"nearest", behavior:"smooth"}), 30); } return; }
  if (e.target.closest("#bodyMap")) selectMuscle(null, null);
});
main.addEventListener("keydown", e => { if (state.view === "shape" && e.target.id === "shapeW" && e.key === "Enter"){ e.preventDefault(); if (saveWeight(e.target.value)){ shape.editW = false; renderShape(); } } });

/* ---------- Conta na nuvem (config.js) ---------- */
const ACCT_KEY = "ficha-acct-pending-v1";
const acct = {step:"email", email:"", busy:false, msg:"", err:false};
const acctBtn = document.getElementById("acctBtn");
const acctSheet = document.getElementById("acctSheet");
/* a conta na nuvem só aparece quando config.js está preenchido e a ficha não está aberta no Claude */
function cloudOn(){ return !!(window.fichaCloud && window.fichaCloud.enabled) && !(window.claude && typeof window.claude.use === "function"); }
function aiOffText(){
  if (!proOffer()) return "A análise só funciona abrindo a ficha pelo app do Claude ou pelo claude.ai.";
  if (cloudOn() && !state.cloud) return "O personal virtual faz parte do Plano Pro. Entre na sua conta (botão Entrar, no topo) para assinar.";
  if (!proActive()) return `O personal virtual faz parte do Plano Pro: ${PRO_TRIAL} grátis, depois ${proPriceText()}.`;
  return "O personal virtual não está disponível agora. Tente de novo mais tarde.";
}
/* o personal parou de responder: some da tela; se faltar a assinatura, a ficha passa a mostrar o Plano Pro */
function aiOff(code){
  chat.off = true;
  if (code === "subscription_required"){ chat.paywall = true; state.pro = {active:false}; }
}
function updateAcctBtn(){
  if (!acctBtn) return;
  /* enquanto conecta, não mostra "Entrar" para quem já está logado */
  acctBtn.hidden = !cloudOn() || state.mode === "loading";
  acctBtn.textContent = state.cloud ? "Conta" : "Entrar";
}
function acctPending(save){
  try{
    if (save === null){ localStorage.removeItem(ACCT_KEY); return; }
    if (save){ localStorage.setItem(ACCT_KEY, JSON.stringify({email:acct.email, at:Date.now()})); return; }
    const p = JSON.parse(localStorage.getItem(ACCT_KEY) || "null");
    if (p && p.email && Date.now() - p.at < 3600000){ acct.email = p.email; acct.step = "code"; }
  }catch(e){}
}
function acctError(e, kind){
  const code = String(e && e.code || ""), st = e && e.status;
  if (!navigator.onLine) return "Sem conexão. Tente de novo quando tiver internet.";
  if (st === 429 || /rate_limit/.test(code)) return "Muitas tentativas seguidas. Espere um minuto e tente de novo.";
  if (kind === "verify" && (code === "otp_expired" || st === 400 || st === 401 || st === 403)) return "Código errado ou vencido. Confira o último e-mail ou peça outro código.";
  if (code === "email_address_invalid" || code === "validation_failed") return "Esse e-mail não foi aceito. Confira se está certo.";
  return "Não deu certo agora. Tente de novo em instantes.";
}
function renderAcct(){
  let h = `<div class="grab"></div><h2 id="acctTitle">Sua conta</h2>`;
  if (state.cloud){
    h += `<p class="sub">Conectado como <b>${esc(state.email || "sua conta")}</b>.</p>
      <div class="box"><p class="mini">Seus treinos, o plano, as anotações do treino e as configurações ficam salvos na nuvem e aparecem em qualquer aparelho em que você entrar com este e-mail.</p>
        <div class="kv"><span>Plano</span><b>${proActive() ? "Pro" : "Grátis"}</b></div></div>
      <button type="button" class="btn" data-pro-open>${proActive() ? "Ver meu Plano Pro" : "Conhecer o Plano Pro"}</button>
      <button type="button" class="btn" data-acct-out ${acct.busy ? "disabled" : ""}>Sair da conta</button>
      <p class="mini">Ao sair, os treinos somem deste aparelho e continuam salvos na sua conta.</p>`;
  } else if (acct.step === "code"){
    h += `<p class="sub">Digite o código que enviamos para <b>${esc(acct.email)}</b>.</p>
      <input class="acct-in code" id="acctCode" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="000000" aria-label="Código recebido por e-mail">
      <button type="button" class="btn primary" data-acct-verify ${acct.busy ? "disabled" : ""}>${acct.busy ? "Entrando…" : "Entrar"}</button>
      <button type="button" class="link" data-acct-resend ${acct.busy ? "disabled" : ""}>Reenviar código</button>
      <button type="button" class="link" data-acct-back>Usar outro e-mail</button>`;
  } else {
    h += `<p class="sub">Entre com seu e-mail para guardar os treinos na nuvem e usar em mais de um aparelho.</p>
      <input class="acct-in" id="acctEmail" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="seu@email.com" value="${esc(acct.email)}" aria-label="E-mail">
      <button type="button" class="btn primary" data-acct-send ${acct.busy ? "disabled" : ""}>${acct.busy ? "Enviando…" : "Enviar código"}</button>
      <p class="mini">Sem senha: você recebe um código por e-mail. Os treinos deste aparelho vão junto para a sua conta.</p>`;
  }
  if (acct.msg) h += `<p class="ok${acct.err ? " err" : ""}" role="status">${esc(acct.msg)}</p>`;
  h += `<button type="button" class="btn-close" data-close>Fechar</button>`;
  document.getElementById("acctBody").innerHTML = h;
}
function openAcct(){
  if (!cloudOn()) return;
  if (!state.cloud && acct.step === "email") acctPending();
  acct.msg = ""; acct.err = false;
  renderAcct(); acctSheet.hidden = false;
  const f = document.getElementById(acct.step === "code" ? "acctCode" : "acctEmail");
  if (f && !state.cloud) setTimeout(() => f.focus(), 60);
}
async function acctSend(){
  const inp = document.getElementById("acctEmail");
  const email = String(inp ? inp.value : acct.email).trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ acct.msg = "Digite um e-mail válido."; acct.err = true; renderAcct(); return; }
  acct.email = email; acct.busy = true; acct.msg = ""; renderAcct();
  try{
    await window.fichaCloud.sendCode(email);
    acct.step = "code"; acctPending(true);
    acct.msg = "Código enviado. Se não chegar em um minuto, confira o spam."; acct.err = false;
  }catch(e){ acct.msg = acctError(e, "send"); acct.err = true; }
  acct.busy = false; renderAcct();
  const f = document.getElementById("acctCode"); if (f) f.focus();
}
async function acctVerify(){
  const code = String((document.getElementById("acctCode") || {}).value || "").replace(/\D/g, "");
  if (code.length < 6){ acct.msg = "Digite o código que chegou no e-mail."; acct.err = true; renderAcct(); return; }
  acct.busy = true; acct.msg = ""; renderAcct();
  try{
    if (!(await window.fichaCloud.verifyCode(acct.email, code))) throw new Error("sem sessão");
    acctPending(null);
    acct.msg = "Pronto! Carregando sua ficha…"; acct.err = false; renderAcct();
    location.reload();
  }catch(e){ acct.busy = false; acct.msg = acctError(e, "verify"); acct.err = true; renderAcct(); }
}
async function acctOut(){
  if (state.dirty.size || state.cfgDirty || state.planDirty || anyPending()){
    if (navigator.onLine){ flushAllDirty(); if (state.cfgDirty) writeCfg(); if (state.planDirty) writePlan(); }
    acct.msg = navigator.onLine ? "Enviando os últimos registros. Quando aparecer Salvo no topo, toque em Sair de novo." : "Há registros que ainda não foram para a nuvem. Conecte-se à internet, espere aparecer Salvo e saia depois.";
    acct.err = true; renderAcct(); return;
  }
  acct.busy = true; renderAcct();
  await window.fichaCloud.signOut();
  resetLocalData();
  try{ localStorage.removeItem(OWNER_KEY); }catch(e){}
  location.reload();
}
if (acctBtn) acctBtn.addEventListener("click", openAcct);
document.addEventListener("click", e => { if (e.target.closest("[data-acct-open]")) openAcct(); });
acctSheet.addEventListener("click", e => {
  if (e.target.id === "acctSheet" || e.target.closest("[data-close]")){ acctSheet.hidden = true; return; }
  if (acct.busy) return;
  if (e.target.closest("[data-acct-send]") || e.target.closest("[data-acct-resend]")) acctSend();
  else if (e.target.closest("[data-acct-verify]")) acctVerify();
  else if (e.target.closest("[data-acct-back]")){ acct.step = "email"; acct.msg = ""; acctPending(null); renderAcct(); }
  else if (e.target.closest("[data-acct-out]")) acctOut();
});
acctSheet.addEventListener("keydown", e => {
  if (e.key !== "Enter" || acct.busy) return;
  if (e.target.id === "acctEmail"){ e.preventDefault(); acctSend(); }
  else if (e.target.id === "acctCode"){ e.preventDefault(); acctVerify(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") acctSheet.hidden = true; });

        <div class="pro-plan"><b>Mensal</b><strong>${PRO_PRICE.mensal}</strong><small>por mês</small></div>
        <div class="pro-plan best"><span class="pro-tag">Economize ${PRO_SAVE}</span><b>Anual</b><strong>${PRO_PRICE.anual}</strong><small>por ano</small></div>
      </div>
      <button type="button" class="btn primary" disabled>Teste grátis em breve</button>
      <p class="mini">As assinaturas ainda não estão abertas. Quando abrirem, você começa com ${PRO_TRIAL} grátis e pode cancelar antes de ser cobrado.</p>`;
  }
  h += `<p class="mini">O registro de cargas, as sugestões série a série, o calendário, o foguinho e o Shape continuam grátis.</p>
    <button type="button" class="btn-close" data-close>Fechar</button>`;
  document.getElementById("proBody").innerHTML = h;
}
function openPro(){ acctSheet.hidden = true; renderPro(); proSheet.hidden = false; }
document.addEventListener("click", e => { if (e.target.closest("[data-pro-open]")) openPro(); });
proSheet.addEventListener("click", e => { if (e.target.id === "proSheet" || e.target.closest("[data-close]")) proSheet.hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") proSheet.hidden = true; });

/* ---------- Navegação ---------- */
const viewsEl = document.getElementById("views");
const calBtn = document.getElementById("calBtn");
function setView(v){
  if (v !== "shape") stopShape();
  if (v !== "calendario" && v !== "editor") state.lastView = v;
  state.view = v;
  viewsEl.querySelectorAll("button[data-view]").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === v)));
  calBtn.setAttribute("aria-pressed", String(v === "calendario"));
  if (v === "analise"){ renderAnalysis(); if (chat.turns.length) scrollEnd(); else window.scrollTo({top:0}); }
  else if (v === "calendario"){ renderCalendar(false); }
  else if (v === "ranking"){ renderRanking(false); window.scrollTo({top:0}); }
  else if (v === "shape"){ renderShape(); window.scrollTo({top:0}); }
  else if (v === "editor"){ renderEditor(false); window.scrollTo({top:0}); }
  else { render(); window.scrollTo({top:0}); }
}
viewsEl.addEventListener("click", e => { const b = e.target.closest("button[data-view]"); if (b && b.dataset.view !== state.view) setView(b.dataset.view); });
calBtn.addEventListener("click", () => setView(state.view === "calendario" ? (state.lastView || "treino") : "calendario"));

function onData(){
  updateFire();
  queueStats();
  /* quem já tinha treinos registrados com o plano modelo não perde nada */
  if (state.blank && !state.plan && loggedSessions().length){ state.blank = false; state.planTemplate = !state.isOwner; applyPlan(DEFAULT_PLAN); if (state.view === "treino") render(); }
  if (state.view === "shape"){ const y = window.scrollY; renderShape(); window.scrollTo({top:y}); return; }
  if (state.view === "editor" || state.view === "ranking") return;
  if (state.view === "analise"){ updateAnalysisStats(); if (!chat.busy && !chat.turns.length) renderThread(); }
  else if (state.view === "calendario") renderCalendar(true);
  else if (state.renderedDeload !== deloadNow()) render();
  else refresh();
}

/* ---------- Início ---------- */
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !/claude\.ai|claudeusercontent/.test(location.hostname)){
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
loadCache();
loadCfg();
try{ const lt = localStorage.getItem(THEME_KEY); if (lt && state.config && !state.config.theme) state.config.theme = lt; }catch(e){}
applyTheme();
loadPlanCache();
state.idPending = !!(window.claude && typeof window.claude.use === "function") || (cloudOn() && window.fichaCloud.hasSession());
state.planPending = !state.plan && state.idPending;
applyAccent();
loadChat();
updateAcctBtn();
render();
updateFire();
connect();
loadSample();
})();
</script>
</body>
