function planText(){
  const out = [];
  DAYS.forEach(d => out.push(`${d.full}: ${dayTitle(d)}`));
  const exLine = (e, i) => `${i+1}. ${e.name} (${e.sets[0].goal === 15 ? "isolado" : "composto"}): ${e.sets.length} séries, metas ${e.sets.map(t => t.label).join(" / ")}, descanso ${e.rest}`;
  Object.values(WORKOUTS).forEach(w => { out.push("", `${w.name}:`); w.exercises.forEach((e, i) => out.push(exLine(e, i))); });
  if (EXTRA.exercises.length){ out.push("", `${EXTRA.name} (nos dias marcados):`); EXTRA.exercises.forEach((e, i) => out.push(exLine(e, i))); }
  return out.join("\n");
}
function logText(){
  const list = loggedSessions().slice(-60);
  if (!list.length) return "Nenhum registro ainda.";
  return list.map(s => {
    const name = workoutName(s.workout);
    const rows = Object.entries(s.sets).filter(([, arr]) => hasData(arr)).map(([id, arr]) => {
      const ex = EX_INDEX[id];
      const sets = arr.map(x => x && (x.kg != null || x.reps != null) ? `${x.kg != null ? x.kg : "?"}x${x.reps != null ? x.reps : "?"}` : "-").join(", ");
      return `  ${ex ? ex.name : id}: ${sets}`;
    });
    return `${s.date} (${name}${s.deload ? ", semana leve" : ""})\n${rows.join("\n")}`;
  }).join("\n");
}
function contextTurn(){
  return `Você é o treinador que acompanha a ficha de treino deste usuário. O objetivo é hipertrofia; ele treina de segunda a sexta e descansa no fim de semana.
Quando houver anotações, leve-as em conta: relacione cada uma com as cargas daquele dia e dos treinos seguintes, aponte padrões (por exemplo, a mesma dor no mesmo exercício) e sugira ajustes práticos de execução, carga ou ordem. Se uma anotação descrever dor forte, dor que piora ou não passa, ou sinais como urina escura, inchaço ou fraqueza incomum, recomende parar o exercício e procurar um médico.
Responda em português do Brasil, de forma direta e prática, com parágrafos curtos e listas simples. Não use tabelas nem títulos grandes; use **negrito** só para destacar o essencial. Baseie tudo nos números registrados abaixo e não invente dados. Se houver poucos registros para concluir algo, diga isso claramente.

Regras da ficha:
- Compostos e máquinas: 1ª série controlada de 10 a 12 reps; 2ª e 3ª até a falha, no máximo 8.
- Isolados: 1ª série de 12 a 15; as outras até a falha, entre 10 e 12.
- Progressão: quando bater o máximo de repetições nas séries pesadas, sobe a carga no treino seguinte. A 1ª série tem progressão própria: se passar de 12 com folga, sobe a carga dela.
- Carga da 1ª série: 70 a 80% da carga da 2ª série nos compostos e máquinas; 80 a 90% nos isolados. No primeiro exercício de cada treino, 60 a 70%, porque o usuário não faz séries de aquecimento e essa série serve para aquecer.
- Aumento de carga: calculado pela força estimada (Epley: carga × (1 + reps/30)) da série pesada mais fraca, buscando a carga que daria a meta de repetições. Arredonda para degraus de 1 kg (abaixo de 10 kg), 2,5 kg (de 10 a 60 kg) ou 5 kg (acima de 60 kg), de 1 a 3 degraus. Com menos de 5 repetições (compostos) ou 8 (isolados), reduzir a carga do mesmo jeito.
- Carga da 1ª série: 70–80% (compostos) ou 80–90% (isolados) da carga equivalente à meta das séries pesadas, calculada com carga e repetições da melhor série pesada.
- Só contam repetições completas, sem roubo.
- Descida controlada em 2 a 3 segundos.
${state.isOwner && !state.planTemplate ? "- Perna 1x por semana e sem stiff são escolhas do usuário: não sugira mudar isso, a não ser que ele pergunte." : "- Respeite a divisão de treino escolhida pelo usuário: não sugira mudá-la, a não ser que ele pergunte."}
- Considere estagnado um exercício sem aumento de carga nem de repetições em 3 sessões seguidas.
- Semana leve (deload): a cada ${state.config.cycle} semanas de treino, uma semana inteira com 2 séries por exercício, mesma carga das séries pesadas, parando 2 a 3 repetições antes da falha. Treinos marcados como "semana leve" não servem de base para progressão. Semanas leves marcadas (segunda-feira de cada uma): ${state.config.deloadWeeks.length ? state.config.deloadWeeks.join(", ") : "nenhuma ainda"}. Próxima semana leve: ${nextDeload().week}${nextDeload().planned ? " (marcada)" : " (sugerida)"}.

Formato dos registros: cada série aparece como carga em kg x repetições, na ordem 1ª, 2ª, 3ª (e 4ª quando houver). "-" é série não registrada. A elevação lateral aparece no Push, no Pull A e no Pull B. Os registros de Pull anteriores a 28/09 foram feitos antes de existir o Pull B.

Hoje é ${fmtDate(isoToday())}/${isoToday().slice(0, 4)}.

Plano:
${planText()}

Registros (mais antigos primeiro):
${logText()}

Anotações do usuário (problemas, dores e observações de cada treino):
${notesText()}`;
}
/* ---------- Resposta às anotações, no próprio treino ---------- */
const noteAI = {busy:false, ctl:null, sid:null, q:null, partial:"", err:"", errSid:null};
function paintNoteReply(){
  const box = document.getElementById("noteReply"), hint = document.getElementById("noteHint");
  if (!box) return;
  const thread = document.getElementById("noteThread"), askRow = document.getElementById("noteAskRow"), foot = document.getElementById("noteFoot");
  const id = curId(), s = state.sessions[id];
  const note = ((s && s.note) || "").trim(), r = s && s.noteReply;
  const chats = s && Array.isArray(s.noteChat) ? s.noteChat : [];
  const busyHere = noteAI.busy && noteAI.sid === id;
  if (hint) hint.textContent = chat.off
    ? "Fica salvo junto com o treino de hoje."
    : "Quando terminar de escrever e tocar fora do campo, eu respondo aqui mesmo.";
  let html = "";
  if (busyHere && noteAI.q == null){
    html = `<div class="nr-h">Resposta do Claude</div><div class="nr-b">${noteAI.partial ? md(noteAI.partial) : '<p class="nr-wait">Analisando sua anotação…</p>'}</div>`;
  } else if (r && r.text){
    html = `<div class="nr-h">Resposta do Claude</div><div class="nr-b">${md(r.text)}</div>`
      + chats.map(c => `<div class="nr-q">${esc(c.q)}</div><div class="nr-b">${md(c.a)}</div>`).join("");
    if (busyHere) html += `<div class="nr-q">${esc(noteAI.q)}</div><div class="nr-b">${noteAI.partial ? md(noteAI.partial) : '<p class="nr-wait">Pensando…</p>'}</div>`;
  }
  if (noteAI.err && noteAI.errSid === id && !busyHere) html += `<p class="nr-err">${esc(noteAI.err)}</p>`;
  if (!html){ box.hidden = true; thread.innerHTML = ""; foot.innerHTML = ""; askRow.hidden = true; return; }
  box.hidden = false;
  thread.innerHTML = html;
  const hasReply = !!(r && r.text);
  askRow.hidden = !hasReply || chat.off;
  const send = askRow.querySelector("[data-note-ask]"); if (send) send.disabled = noteAI.busy;
  const stale = hasReply && !!note && note !== r.for;
  foot.innerHTML = (stale ? `<p class="nr-stale">Essa resposta é da versão anterior da anotação.</p>` : "")
    + (chat.off || busyHere ? "" : `<button type="button" class="link nr-again" data-note-again>${!hasReply ? "Tentar de novo" : stale ? "Responder de novo" : "Analisar de novo"}</button>`);
}
function notePrompt(s, note){
  return `Agora responda só à anotação abaixo, escrita pelo usuário no treino de ${fmtDate(s.date)} (${workoutName(s.workout)}):
"${note}"

Responda em até 6 frases curtas ou uma lista curta, direto ao ponto:
- o que provavelmente está acontecendo, ligando com as cargas e repetições desse dia e dos treinos anteriores;
- o que fazer no próximo treino (execução, carga, ordem ou troca de exercício);
- se for caso de parar o exercício ou procurar um médico, diga isso claramente.
Se a anotação for só uma observação e não um problema, comente em uma ou duas frases se ela muda algo no treino.
Se o usuário fizer perguntas depois, responda de forma curta e prática, sempre ligada a essa anotação e aos registros.`;
}
async function runNote(id, msgs, q, onDone){
  const fn = sampleFn || (sampleReady ? await sampleReady : null);
  if (!fn){ noteAI.busy = false; return false; }
  Object.assign(noteAI, {busy:true, sid:id, q, partial:"", err:"", errSid:null});
  const ctl = new AbortController(); noteAI.ctl = ctl;
  paintNoteReply();
  let ok = false;
  try{
    const res = await fn(msgs, {
      cache:false, signal:ctl.signal,
      onText: ({text}) => { noteAI.partial = text; if (state.view === "treino" && curId() === id) paintNoteReply(); }
    });
    onDone(res.text); ok = true;
  }catch(e){
    const code = e && e.code;
    if (e && e.text && code !== "refused" && code !== "cancelled"){ onDone(e.text); ok = true; }
    else { noteAI.err = errCopy(code) || "Não foi possível responder agora."; noteAI.errSid = id; }
    if (HIDE_CODES.includes(code)) chat.off = true;
  }finally{
    noteAI.busy = false; noteAI.ctl = null; noteAI.partial = ""; noteAI.q = null;
    if (state.view === "treino") paintNoteReply();
  }
  return ok;
}
async function analyzeNote(force){
  if (chat.off || noteAI.busy) return;
  const id = curId(), s = state.sessions[id];
  const note = ((s && s.note) || "").trim();
  if (!s || note.length < 6) return;
  if (!force && s.noteReply && s.noteReply.for === note) return;
  await runNote(id, [{role:"user", content:contextTurn() + "\n\n" + notePrompt(s, note)}], null, text => {
    const cur = state.sessions[id] || s;
    cur.noteReply = {text, for:note, at:new Date().toISOString()};
    cur.noteChat = [];
    touch(id);
  });
}
async function askNote(){
  const box = document.getElementById("noteAsk");
  const q = box ? box.value.trim().slice(0, 1000) : "";
  if (!q || chat.off || noteAI.busy) return;
  const id = curId(), s = state.sessions[id];
  if (!s || !s.noteReply) return;
  box.value = ""; autoGrow(box);
  const prior = Array.isArray(s.noteChat) ? s.noteChat.slice(-6) : [];
  const msgs = [{role:"user", content:contextTurn() + "\n\n" + notePrompt(s, s.noteReply.for)}, {role:"assistant", content:s.noteReply.text}];
  prior.forEach(c => msgs.push({role:"user", content:c.q}, {role:"assistant", content:c.a}));
  msgs.push({role:"user", content:q});
  const ok = await runNote(id, msgs, q, text => {
    const cur = state.sessions[id] || s;
    cur.noteChat = (Array.isArray(cur.noteChat) ? cur.noteChat : []).concat([{q, a:text}]).slice(-20);
    touch(id);
  });
  if (!ok){ const b2 = document.getElementById("noteAsk"); if (b2 && !b2.value){ b2.value = q; autoGrow(b2); } }
}

function notesText(){
  const list = Object.values(state.sessions)
    .filter(s => s && s.date && typeof s.note === "string" && s.note.trim())
    .sort((a, b) => a.date.localeCompare(b.date)).slice(-40);
  return list.length ? list.map(s => `${s.date} (${workoutName(s.workout)}): ${s.note.trim().replace(/\s+/g, " ")}`).join("\n") : "Nenhuma anotação.";
}

function errCopy(code){
  switch (code){
    case "cancelled": return "";
    case "rate_limited": return "Muitas perguntas seguidas ou limite de uso atingido. Tente de novo em alguns minutos.";
    case "session_expired": return "Sua sessão do Claude expirou. Entre de novo e volte aqui.";
    case "refused": return "Não foi possível responder a essa pergunta. Tente escrever de outro jeito.";
    case "prompt_too_large": return "A conversa ficou grande demais. Toque em Nova conversa e pergunte de novo.";
    case "empty_completion": return "A resposta veio vazia. Tente uma pergunta mais específica.";
    default:
      if (HIDE_CODES.includes(code)) return "A análise não está disponível aqui. Abra a ficha pelo app do Claude ou pelo claude.ai.";
      return "A resposta foi interrompida. Envie a pergunta de novo.";
  }
}

async function ask(q){
  q = String(q || "").trim();
  if (!q || chat.busy || chat.off) return;
  const box = document.getElementById("ask");
  if (box){ box.value = ""; autoGrow(box); }
  chat.note = ""; chat.noteErr = false;
  chat.turns.push({role:"user", content:q});
  chat.busy = true; chat.partial = "";
  saveChat(); renderThread(); scrollEnd();
  const fn = sampleFn || (sampleReady ? await sampleReady : null);
  if (!fn){ chat.busy = false; chat.off = true; renderThread(); updateComposer(); return; }
  const ctl = new AbortController(); chat.ctl = ctl;
  const hist = chat.turns.slice(-12);
  while (hist.length && hist[0].role !== "user") hist.shift();
  try{
    const res = await fn([{role:"user", content:contextTurn()}, ...hist], {
      cache:false, signal:ctl.signal,
      onText: ({text}) => {
        chat.partial = text;
        const live = document.getElementById("live");
        if (live) live.innerHTML = md(text);
      }
    });
    chat.turns.push({role:"assistant", content:res.text});
    if (res.truncated){ chat.note = "A resposta foi cortada no meio. Peça algo mais específico."; }
  }catch(e){
    const code = e && e.code;
    if (e && e.text && code !== "refused") chat.turns.push({role:"assistant", content:e.text + (code === "cancelled" ? "\n\n(resposta interrompida)" : "")});
    chat.note = errCopy(code); chat.noteErr = !!chat.note;
    if (HIDE_CODES.includes(code)) chat.off = true;
  }finally{
    chat.busy = false; chat.ctl = null; chat.partial = "";
    saveChat(); renderThread(); updateComposer();
  }
}

function okNote(id, text, err){ const el = document.getElementById(id); if (!el) return; el.hidden = false; el.classList.toggle("err", !!err); el.textContent = text; }
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }catch(e){}
  try{
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand("copy"); ta.remove(); return ok;
  }catch(e){ return false; }
}
async function exportBackup(){
  const data = JSON.stringify({app:"ficha-treino", version:2, exportedAt:new Date().toISOString(), sessions:state.sessions, config:state.config, plan:state.plan}, null, 1);
  const name = `backup-treino-${isoToday()}.json`;
  try{
    const file = new File([data], name, {type:"application/json"});
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); okNote("obnote", "Backup exportado."); return; }
  }catch(e){ if (e && e.name === "AbortError") return; }
  try{
    const url = URL.createObjectURL(new Blob([data], {type:"application/json"}));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    okNote("obnote", "Backup exportado.");
  }catch(e){ okNote("obnote", "Não foi possível exportar o backup.", true); }
}
function importBackup(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const c = JSON.parse(String(r.result));
      const incoming = c && c.sessions && typeof c.sessions === "object" ? c.sessions : null;
      if (!incoming) throw new Error("formato");
      let n = 0;
      for (const [id, x] of Object.entries(incoming)){
        if (!x || !x.date || !x.sets) continue;
        const cur = state.sessions[id];
        if (!cur || (x.updatedAt || "") >= (cur.updatedAt || "")){ state.sessions[id] = x; n++; }
      }
      if (c.config && typeof c.config === "object"){ applyCfg(c.config); applyAccent(); saveCfg(); }
      const p = c.plan && normalizePlan(c.plan);
      if (p){ state.plan = p; applyPlan(p); savePlanCache(); }
      saveCache(); updateAnalysisStats(); updateFire();
      okNote("obnote", n ? `${n} ${n === 1 ? "treino importado" : "treinos importados"}.` : "Nada novo para importar.");
    }catch(e){ okNote("obnote", "Esse arquivo não é um backup da ficha.", true); }
  };
  r.onerror = () => okNote("obnote", "Não foi possível ler o arquivo.", true);
  r.readAsText(file);
}

function renderThread(){
  const t = document.getElementById("thread"); if (!t) return;
  let html = "";
  if (!chat.turns.length && !chat.busy){
    html += `<div class="chips">${QUICK.map(q => `<button type="button" class="chip" data-q="${esc(q)}" ${chat.off ? "disabled" : ""}>${esc(q)}</button>`).join("")}</div>`;
    if (!loggedSessions().length) html += `<p class="chat-note">Ainda não há treinos registrados. Registre alguns na aba Treino para a análise ter números para avaliar.</p>`;
  } else {
    html += `<div class="thread-head"><button type="button" class="link" data-new ${chat.busy ? "disabled" : ""}>Nova conversa</button></div>`;
  }
  chat.turns.forEach(m => { html += m.role === "user" ? `<div class="msg user">${esc(m.content)}</div>` : `<div class="msg bot">${md(m.content)}</div>`; });
  if (chat.busy) html += `<div class="msg bot" id="live">${chat.partial ? md(chat.partial) : '<span class="thinking">Analisando seus registros…</span>'}</div>`;
  if (chat.note) html += `<p class="chat-note ${chat.noteErr ? "err" : ""}">${esc(chat.note)}</p>`;
  t.innerHTML = html;
}
function updateComposer(){
  const box = document.getElementById("ask"), send = document.getElementById("send"), avail = document.getElementById("avail");
  if (!box || !send) return;
  box.disabled = chat.off;
  if (avail) avail.hidden = !chat.off || !!chat.note;
  if (chat.busy){ send.innerHTML = ICON_STOP; send.setAttribute("aria-label", "Parar resposta"); send.disabled = false; }
  else { send.innerHTML = ICON_SEND; send.setAttribute("aria-label", "Enviar"); send.disabled = chat.off; }
}
function autoGrow(el){ el.style.height = "auto"; el.style.height = Math.min(el.scrollHeight, 124) + "px"; }
function scrollEnd(){ requestAnimationFrame(() => window.scrollTo({top:document.documentElement.scrollHeight})); }

main.addEventListener("click", e => {
  if (state.view !== "analise") return;
  const chip = e.target.closest("[data-q]");
  if (chip && !chip.disabled){ ask(chip.dataset.q); updateComposer(); return; }
  if (e.target.closest("[data-new]") && !chat.busy){ chat.turns = []; chat.note = ""; saveChat(); renderThread(); updateComposer(); return; }
  if (e.target.closest("#send")){
    if (chat.busy){ if (chat.ctl) chat.ctl.abort(); return; }
    const box = document.getElementById("ask");
    ask(box ? box.value : ""); updateComposer();
  }
});
main.addEventListener("input", e => { if (e.target.id === "ask") autoGrow(e.target); });
main.addEventListener("keydown", e => {

function openFinish(){
  const s = state.sessions[curId()]; if (!s) return;
  const day = DAYS[state.day];
  const {total, done} = dayProgress(s);
  let vol = 0; const prs = [], ups = [];
  const dl = deloadNow();
  dayExercises().forEach(ex => {
    const arr = s.sets ? s.sets[ex.id] : null; if (!Array.isArray(arr)) return;
    const used = arr.slice(0, setsFor(ex).length).filter(x => x && x.done);
    used.forEach(x => { vol += (x.kg || 0) * (x.reps || 0); });
    const best = bestKgBefore(ex.id);
    const top = used.length ? Math.max(...used.map(x => x.kg || 0)) : null;
    if (best != null && top != null && top > best) prs.push(`${ex.name}: <b>${fmtKg(top)} kg</b> (antes ${fmtKg(best)} kg)`);
    if (!dl){ const p = progression(ex, arr); if (p && p.kind === "up") ups.push(`${ex.name}: <b>${fmtKg(p.kg)} kg</b> (+${fmtKg(p.add)} kg)`); }
  });
  const prevVol = prevWorkoutVolume();
  const start = s.startedAt ? Date.parse(s.startedAt) : null, end = s.finishedAt ? Date.parse(s.finishedAt) : Date.now();
  const mins = start ? Math.max(1, Math.round((end - start) / 60000)) : 0;
  const streak = streakInfo().current;
  const vt = Math.round(vol).toLocaleString("pt-BR");
  document.getElementById("finishBody").innerHTML = `<div class="grab"></div>
    <div class="fin-badge">${ICON_CHECK}</div>
    <h2 id="finTitle">Treino finalizado</h2>
    <p class="sub">${esc(dayTitle(day))}, ${fmtDate(s.date)}${dl ? ", semana leve" : ""}</p>
    <div class="fin-grid">
      <div><span>Tempo</span><b>${mins ? `${mins} min` : "—"}</b></div>
      <div><span>Volume</span><b>${vt} kg</b>${prevVol ? `<small>${Math.round(vol / prevVol * 100)}% do último</small>` : ""}</div>
      <div><span>Séries</span><b>${done} de ${total}</b></div>
      <div><span>Recordes</span><b>${prs.length}</b></div>
    </div>
    ${prs.length ? `<div class="box"><b>Recordes de carga</b><ul>${prs.map(x => `<li>${x}</li>`).join("")}</ul></div>` : ""}
    ${ups.length ? `<div class="box"><b>No próximo treino, suba a carga</b><ul>${ups.map(x => `<li>${x}</li>`).join("")}</ul></div>` : ""}
    ${streak ? `<div class="fin-fire">${fireSVG(true, 30)}<span><b>${streak} ${streak === 1 ? "dia seguido" : "dias seguidos"}</b> no foguinho</span></div>` : ""}
    <button type="button" class="btn-close" data-close>Fechar</button>`;
  document.getElementById("finishSheet").hidden = false;
}

function daysBetween(a, b){ return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
function streakInfo(){
  const today = isoToday(), month = today.slice(0, 7);
  const loggedDates = new Set(loggedSessions().map(s => s.date));
  const restores = state.config.restores || [];
  const restored = new Set(restores.map(r => r.date));
  const used = restores.filter(r => r.usedAt === month).length;
  const info = {current:0, best:0, today, loggedToday:loggedDates.has(today), pending:false, gap:[], prevChain:0, left:Math.max(0, 3 - used), used, canRestore:false};
  if (!loggedDates.size) return info;
  const first = [...loggedDates].sort()[0];
  let run = 0, started = false, best = 0, gap = [], prevChain = 0;
  for (let d = first; d <= today; d = addDays(d, 1)){
    const weekend = isRestDate(d);
    if (loggedDates.has(d)){ run++; started = true; }
    else if (weekend || restored.has(d)){ if (started) run++; }
    else if (d === today){ info.pending = true; }
    else { if (started){ prevChain = run; gap = [d]; } else gap.push(d); run = 0; started = false; }
    if (run > best) best = run;
  }
  info.current = run; info.best = best; info.gap = gap; info.prevChain = prevChain;
  const lastMiss = gap.length ? gap[gap.length - 1] : null;
  info.canRestore = !!lastMiss && prevChain > 0 && gap.length <= info.left && daysBetween(lastMiss, today) <= 7;
  return info;
}
function updateFire(){
  const info = streakInfo(), on = info.current > 0;
  const btn = document.getElementById("fireBtn"); if (!btn) return;
  btn.className = `fire-btn ${on ? "on" : "off"}`;
  document.getElementById("fireIcon").innerHTML = fireSVG(on, 24);
  document.getElementById("fireN").textContent = String(info.current);
  btn.setAttribute("aria-label", on ? `Foguinho aceso: ${info.current} dias seguidos` : "Foguinho apagado");
  if (!document.getElementById("fireSheet").hidden) renderFireSheet(info);
}
function listDates(arr){ const f = arr.map(fmtDate); return f.length > 1 ? `${f.slice(0, -1).join(", ")} e ${f[f.length - 1]}` : f[0]; }
function renderFireSheet(info){
  info = info || streakInfo();
  const on = info.current > 0;
  const wd = parseISO(info.today).getDay(), weekend = wd === 0 || wd === 6;
  const n = info.gap.length;

  if (on && info.loggedToday) sub = "Treino de hoje registrado. O foguinho está garantido.";
  else if (on && weekend) sub = "Fim de semana conta como descanso. O foguinho segue aceso.";
  else if (on) sub = "Registre uma carga hoje para o foguinho não apagar.";
  else if (info.canRestore) sub = `Você faltou em ${listDates(info.gap)}. Use ${n === 1 ? "1 restauração" : `${n} restaurações`} para reacender.`;
  else if (n && info.prevChain > 0 && info.left < n && daysBetween(info.gap[n - 1], info.today) <= 7) sub = "Não há restaurações suficientes este mês. Registre um treino para acender de novo.";
  else sub = "Registre um treino para acender o foguinho.";
  const merge = on && info.canRestore ? `<p class="sub">Você faltou em ${listDates(info.gap)}. Restaure para juntar com os ${info.prevChain} dias anteriores.</p>` : "";
  const dots = [0, 1, 2].map(i => `<i class="${i < info.used ? "used" : ""}"></i>`).join("");
  document.getElementById("fireBody").innerHTML = `<div class="grab"></div>
    ${fireSVG(on, 88)}
    <h2 id="fireTitle">${on ? `${info.current} ${info.current === 1 ? "dia seguido" : "dias seguidos"}` : "Foguinho apagado"}</h2>
    <p class="sub">${sub}</p>
    ${merge}
    ${info.canRestore ? `<button type="button" class="btn-fire" data-restore>Restaurar foguinho (usa ${n})</button>` : ""}
    <div class="box">

    </ul></div>
    <button type="button" class="btn-close" data-close>Fechar</button>`;
}

/* ---------- Visão do ano ---------- */
const MONTHS_SHORT = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
function sessionVolume(sess){
  let v = 0;
  Object.values(sess.sets || {}).forEach(arr => { if (Array.isArray(arr)) arr.forEach(x => { if (x && x.kg != null && x.reps != null) v += x.kg * x.reps; }); });
  return v;
}
function yearHTML(year, byDate, today){
  const logged = loggedSessions();
  const years = logged.map(s => +s.date.slice(0, 4));
  const minY = Math.min(+today.slice(0, 4), ...(years.length ? years : [+today.slice(0, 4)]));
  const maxY = +today.slice(0, 4);
  const restored = new Set((state.config.restores || []).map(r => r.date));
  const ys = String(year);
  const inYear = logged.filter(s => s.date.startsWith(ys));
  const days = new Set(inYear.map(s => s.date));
  const vol = inYear.reduce((a, s) => a + sessionVolume(s), 0);
  let weekdays = 0, hit = 0;
  if (logged.length){
    const start = logged[0].date > `${ys}-01-01` ? logged[0].date : `${ys}-01-01`;
    const end = today < `${ys}-12-31` ? today : `${ys}-12-31`;
    for (let d = start; d <= end; d = addDays(d, 1)){
      if (isRestDate(d)) continue;
      if (d === today && !days.has(d)) continue;
      weekdays++; if (days.has(d) || restored.has(d)) hit++;
    }
  }
  const freq = weekdays ? Math.round(hit / weekdays * 100) : 0;
  const volTxt = vol >= 1000 ? `${(vol / 1000).toLocaleString("pt-BR", {maximumFractionDigits:1})} t` : `${Math.round(vol)} kg`;
  const best = streakInfo().best;
  let months = "";
  for (let m = 0; m < 12; m++){
    const first = new Date(year, m, 1, 12);
    const lead = (first.getDay() + 6) % 7;
    const nDays = new Date(year, m + 1, 0).getDate();
    let cells = "", count = 0;
    for (let i = 0; i < lead; i++) cells += `<i class="yd empty"></i>`;
    for (let d = 1; d <= nDays; d++){
      const iso = `${ys}-${pad(m + 1)}-${pad(d)}`;
      const wd = (lead + d - 1) % 7;
      const sess = byDate[iso];
      let cls = "yd" + (wd >= 5 ? " we" : "");
      let tip = fmtDate(iso);
      if (sess){ count++; cls += isDeload(iso) ? " dl" : " on"; tip += ": " + sess.map(x => workoutName(x.workout)).join(" + "); }
      else if (restored.has(iso)){ cls += " rs"; tip += ": restaurado"; }
      if (iso === today) cls += " td";
      if (iso > today) cls += " fut";
      cells += `<i class="${cls}" title="${tip}"></i>`;
    }
    months += `<div class="ym"><div class="ymh"><b>${MONTHS_SHORT[m]}</b><span>${count || ""}</span></div><div class="ygrid">${cells}</div></div>`;
  }
  return `<section class="year" aria-label="Visão do ano">
    <div class="yhead"><h3>Visão do ano</h3>
      <div class="ynav"><button type="button" data-ystep="-1" aria-label="Ano anterior" ${year <= minY ? "disabled" : ""}>‹</button><b>${year}</b><button type="button" data-ystep="1" aria-label="Próximo ano" ${year >= maxY ? "disabled" : ""}>›</button></div>
    </div>
    <div class="ystats">
      <div><span>Treinos</span><b>${days.size}</b></div>
      <div><span>Frequência</span><b>${freq}%</b></div>
      <div><span>Volume</span><b>${volTxt}</b></div>
      <div><span>Recorde</span><b>${best} ${best === 1 ? "dia" : "dias"}</b></div>
    </div>
    <div class="ymonths">${months}</div>
    <div class="ylegend"><span><i class="lg-on"></i>Treino</span><span><i class="lg-dl"></i>Semana leve</span><span><i class="lg-rs"></i>Restaurado</span><span><i class="lg-no"></i>Sem treino</span></div>
    <p class="mini ynote">Frequência: dias de semana treinados (ou restaurados) desde o seu primeiro registro no ano.</p>
  </section>`;
}

/* ---------- Calendário ---------- */
function weekCard(m, cur, today, byDate, nd){
  const deload = state.config.deloadWeeks.includes(m);
  const suggested = !deload && !nd.planned && nd.week === m;
  const cls = ["week"];
  if (m === cur) cls.push("current");
  if (deload) cls.push("deload");
  const restoredSet = new Set((state.config.restores || []).map(r => r.date));
  const days = DAYS.map((d, i) => {
    const iso = addDays(m, i);
    const sess = byDate[iso] || [];
    const done = sess.length > 0;
    if (!done && restoredSet.has(iso)) return `<div class="day restored"><span class="dl">${d.label}</span><span class="dw">Restaurado</span><span class="ds">${fireSVG(true, 14)}</span></div>`;
    const wname = done ? sess.map(s => workoutName(s.workout)).join(" + ") : dayName(d);
    const st = done ? "done" : isRestDate(iso) ? "rest" : iso < today ? "miss" : iso === today ? "today" : "next";
    return `<div class="day ${st}"><span class="dl">${d.label}</span><span class="dw">${esc(wname)}</span><span class="ds">${done ? ICON_CHECK : ""}</span></div>`;
  }).join("");
  const tags = (m === cur ? `<span class="wtag">Esta semana</span>` : "") + (suggested ? `<span class="wtag sug">Sugerida para semana leve</span>` : "");
  return `<article class="${cls.join(" ")}" data-wk="${m}">
    <div class="wk-head"><div><b>${fmtDate(m)} a ${fmtDate(addDays(m, 6))}</b>${tags}</div>
      <button type="button" class="switch" role="switch" aria-checked="${deload}" data-week="${m}"><span>Semana leve</span><i></i></button></div>
    <div class="days">${days}</div>
  </article>`;
}
function renderCalendar(keepScroll){

  main.classList.add("chat");
  tabsEl.hidden = true;
  const today = isoToday(), cur = mondayOf(today);

  const logged = loggedSessions();
  let start = logged.length ? mondayOf(logged[0].date) : cur;
  if (start < addDays(cur, -56)) start = addDays(cur, -56);

      <div class="stats">
        <div class="stat"><span>Semana do ciclo</span><strong class="num">${inDeload ? "Leve" : `${Math.min(cycleWeek(), 99)} de ${state.config.cycle}`}</strong></div>
        <div class="stat"><span>Próxima leve</span><strong class="num">${fmtDate(nd.week)}</strong></div>
        <div class="stat"><span>Treinos feitos</span><strong class="num">${Object.keys(byDate).length}</strong></div>
      </div>
      <div class="cycle"><span>Semana leve a cada</span><div class="seg2">${[6, 8].map(n => `<button type="button" data-cycle="${n}" aria-pressed="${state.config.cycle === n}">${n} semanas</button>`).join("")}</div></div>
    </section>`;
  html += yearHTML(state.calYear || +today.slice(0, 4), byDate, today);
  html += `<h3 class="section">Semanas</h3>`;
  html += weeks.map(m => weekCard(m, cur, today, byDate, nd)).join("");
  html += `<section class="rules"><h3>Na semana leve</h3><ul>
    <li>Todos os treinos da semana ficam com <b>2 séries</b> por exercício.</li>
    <li>Use a <b>mesma carga</b> das séries pesadas e pare <b>2 a 3 repetições antes da falha</b>.</li>
    <li>A ficha não sugere aumento de carga nessa semana, e esses treinos não entram como "Anterior" nas semanas seguintes.</li>
  </ul></section>`;
  main.innerHTML = html;
  if (keepScroll) window.scrollTo({top:y});
  else window.scrollTo({top:0});
}
main.addEventListener("click", e => {
  if (state.view !== "calendario") return;
  const yb = e.target.closest("[data-ystep]");
  if (yb){ state.calYear = (state.calYear || +isoToday().slice(0, 4)) + (+yb.dataset.ystep); renderCalendar(true); return; }
  const sw = e.target.closest("[data-week]");
  if (sw){
    const m = sw.dataset.week;
    const set = new Set(state.config.deloadWeeks);
    if (set.has(m)) set.delete(m); else set.add(m);
    state.config.deloadWeeks = [...set].sort();
    writeCfg();
    renderCalendar(true);
    return;
  }
  const cy = e.target.closest("[data-cycle]");
  if (cy){ state.config.cycle = +cy.dataset.cycle === 8 ? 8 : 6; writeCfg(); renderCalendar(true); }
});

/* ---------- Plano: salvar e sincronizar ---------- */
const PLAN_KEY = "ficha-plan-v1";
state.plan = null; state.planTemplate = false; state.planRef = null; state.planDirty = false; state.planWriting = false; state.planAgain = false;
function loadPlanCache(){
  try{
    const c = JSON.parse(localStorage.getItem(PLAN_KEY) || "null");
    const p = c && normalizePlan(c.plan);
    if (p){ state.plan = p; applyPlan(p); state.planDirty = !!c.dirty; }
  }catch(e){}
}
function savePlanCache(){ try{ localStorage.setItem(PLAN_KEY, JSON.stringify({plan:state.plan, dirty:state.planDirty})); }catch(e){} }
async function writePlan(){
  state.planDirty = true; savePlanCache();
  if (state.mode !== "db" || !state.planRef || !state.plan) return;
  if (state.planWriting){ state.planAgain = true; return; }
  state.planWriting = true; setStatus("saving");
  try{
    await state.planRef.set(JSON.parse(JSON.stringify(state.plan)));
    if (!state.planAgain){ state.planDirty = false; savePlanCache(); }
    if (!anyPending()) setStatus("saved");
  }catch(e){ setStatus(e && e.code === "quota_exceeded" ? "full" : "offline"); }
  finally{ state.planWriting = false; if (state.planAgain){ state.planAgain = false; writePlan(); } }
}
function subscribePlan(){
  state.planRef.onSnapshot(snap => {
    if (state.planDirty || state.planWriting){ writePlan(); return; }
    if (snap.exists){
      const p = normalizePlan(snap.data());
      if (p){ state.plan = p; applyPlan(p); state.planTemplate = false; savePlanCache(); }
    } else {
      state.planTemplate = !state.isOwner && !state.plan;
    }
    onPlanChanged();
  }, () => {});
}
function onPlanChanged(){
  if (state.view === "treino") render();
  else if (state.view === "calendario") renderCalendar(true);
  else if (state.view === "analise") updateAnalysisStats();
  updateFire();
}

/* ---------- Editor de treino ---------- */
const clone = o => JSON.parse(JSON.stringify(o));
function edList(w){ return w === "extra" ? state.draft.extra.exercises : state.draft.workouts[w].exercises; }
function edExHTML(w, e, i, n){
  return `<div class="ed-ex" data-w="${w}" data-i="${i}">
    <div class="ed-r1"><span class="ed-n">${String(i + 1).padStart(2, "0")}</span>
      <input class="ed-in" data-f="name" value="${esc(e.name)}" placeholder="Nome do exercício" aria-label="Nome do exercício">
      <div class="ed-mv"><button type="button" data-mv="-1" aria-label="Subir" ${i === 0 ? "disabled" : ""}>↑</button><button type="button" data-mv="1" aria-label="Descer" ${i === n - 1 ? "disabled" : ""}>↓</button><button type="button" data-rm aria-label="Remover">✕</button></div>
    </div>
    <div class="ed-r2">
      <select data-f="scheme" aria-label="Tipo"><option value="A" ${e.scheme !== "B" ? "selected" : ""}>Composto</option><option value="B" ${e.scheme === "B" ? "selected" : ""}>Isolado</option></select>
      <select data-f="rest" aria-label="Descanso"><option value="heavy" ${e.rest === "heavy" ? "selected" : ""}>2–3 min</option><option value="light" ${e.rest === "light" ? "selected" : ""}>1–1,5 min</option><option value="short" ${e.rest === "short" ? "selected" : ""}>1 min</option></select>
      <div class="ed-sets" aria-label="Séries"><button type="button" data-sets="-1" aria-label="Menos séries">−</button><b>${e.sets}x</b><button type="button" data-sets="1" aria-label="Mais séries">+</button></div>
    </div>
    <input class="ed-in ed-tip" data-f="tip" value="${esc(e.tip || "")}" placeholder="Dica (opcional)" aria-label="Dica">
  </div>`;
}
function renderEditor(keep){
  const y = window.scrollY;
  main.classList.add("chat"); tabsEl.hidden = true;
  const d = state.draft;
  const opts = sel => `<option value="" ${!sel ? "selected" : ""}>Descanso</option>` + Object.entries(d.workouts).map(([k, w]) => `<option value="${k}" ${sel === k ? "selected" : ""}>${esc(w.name || "Treino")}</option>`).join("");
  let html = `<section class="summary"><h2>Editar treino</h2><p class="when">Monte seus treinos, escolha os dias e toque em Salvar. Trocar o nome de um exercício mantém o histórico dele.</p></section>
    <section class="panel"><h3>Semana</h3>${DAYS.map((day, i) => `<div class="ed-day"><b>${day.label}</b>
      <select data-dsel="${i}" aria-label="Treino de ${day.full}">${opts(d.days[i].workout)}</select>
      <label class="ed-chk"><input type="checkbox" data-dx="${i}" ${d.days[i].extra ? "checked" : ""}> ${esc(d.extra.name || "Complemento")}</label></div>`).join("")}
      <p class="mini">Sábado e domingo são sempre descanso. Dias marcados como Descanso também não apagam o foguinho.</p></section>`;
  Object.entries(d.workouts).forEach(([k, w]) => {
    html += `<section class="panel ed-w"><div class="ed-wh"><input class="ed-in ed-wn" data-wname="${k}" value="${esc(w.name)}" placeholder="Nome do treino" aria-label="Nome do treino"><button type="button" class="ed-del" data-delw="${k}">Excluir treino</button></div>
      ${w.exercises.map((e, i) => edExHTML(k, e, i, w.exercises.length)).join("")}
      <button type="button" class="btn ed-add" data-addex="${k}">+ Adicionar exercício</button></section>`;
  });
  html += `<button type="button" class="btn ed-add ed-neww" data-addw>+ Novo treino</button>
    <section class="panel ed-w"><div class="ed-wh"><input class="ed-in ed-wn" data-xname value="${esc(d.extra.name)}" placeholder="Nome do complemento" aria-label="Nome do complemento"></div>
      <p class="mini">Complemento que entra no fim dos dias marcados na semana, como o abdômen.</p>
      ${d.extra.exercises.map((e, i) => edExHTML("extra", e, i, d.extra.exercises.length)).join("")}
      <button type="button" class="btn ed-add" data-addex="extra">+ Adicionar exercício</button></section>
    ${state.isOwner || state.planTemplate || state.mode !== "db" ? `<button type="button" class="link ed-reset" data-edreset>Voltar ao treino original</button>` : ""}
    <div class="ed-actions"><button type="button" class="btn" data-edcancel>Cancelar</button><button type="button" class="btn primary" data-edsave>Salvar treino</button></div>`;
  main.innerHTML = html;
  if (keep) window.scrollTo({top:y});
}
function openEditor(){ state.draft = clone(currentPlan()); setView("editor"); }
function saveEditor(){
  const p = normalizePlan(state.draft);
  if (!p) return;
  state.plan = p; state.planTemplate = false;
  applyPlan(p);
  writePlan();
  state.draft = null;
  setView("treino");
}
main.addEventListener("click", e => {
  if (state.view === "treino" && e.target.closest("[data-edit]")){ openEditor(); return; }
  if (state.view !== "editor" || !state.draft) return;
  const t = e.target, d = state.draft;
  const row = t.closest(".ed-ex");
  if (row && t.closest("[data-mv]")){
    const list = edList(row.dataset.w), i = +row.dataset.i, j = i + (+t.closest("[data-mv]").dataset.mv);
    if (j >= 0 && j < list.length){ [list[i], list[j]] = [list[j], list[i]]; renderEditor(true); }
    return;
  }
  if (row && t.closest("[data-rm]")){ edList(row.dataset.w).splice(+row.dataset.i, 1); renderEditor(true); return; }
  if (row && t.closest("[data-sets]")){
    const ex = edList(row.dataset.w)[+row.dataset.i];
    ex.sets = Math.min(6, Math.max(1, ex.sets + (+t.closest("[data-sets]").dataset.sets)));
    renderEditor(true); return;
  }
  const add = t.closest("[data-addex]");
  if (add){ edList(add.dataset.addex).push({id:"", name:"", scheme:"A", sets:3, rest:"light", tip:""}); renderEditor(true);
    const ins = main.querySelectorAll(`.ed-ex[data-w="${add.dataset.addex}"] input[data-f="name"]`); if (ins.length) ins[ins.length - 1].focus(); return; }
  if (t.closest("[data-addw]")){
    const k = "w" + Date.now().toString(36);
    d.workouts[k] = {name:`Treino ${String.fromCharCode(65 + Object.keys(d.workouts).length % 26)}`, exercises:[]};
    renderEditor(true); return;
  }
  const del = t.closest("[data-delw]");
  if (del){
    const k = del.dataset.delw;
    if (!confirm(`Excluir o treino "${d.workouts[k].name}"? Os registros antigos continuam salvos.`)) return;
    delete d.workouts[k];
    d.days.forEach(x => { if (x.workout === k) x.workout = ""; });
    renderEditor(true); return;
  }
  if (t.closest("[data-edreset]")){ if (confirm("Voltar ao treino original? As mudanças não salvas serão perdidas.")){ state.draft = clone(DEFAULT_PLAN); renderEditor(true); } return; }
  if (t.closest("[data-edcancel]")){ state.draft = null; setView("treino"); return; }
  if (t.closest("[data-edsave]")) saveEditor();
});
main.addEventListener("input", e => {
  if (state.view !== "editor" || !state.draft) return;
  const t = e.target, row = t.closest(".ed-ex");
  if (row && t.dataset.f && t.tagName === "INPUT"){ edList(row.dataset.w)[+row.dataset.i][t.dataset.f] = t.value; return; }
  if (t.dataset.wname){ state.draft.workouts[t.dataset.wname].name = t.value; return; }
  if (t.hasAttribute("data-xname")) state.draft.extra.name = t.value;
});
main.addEventListener("change", e => {
  if (state.view !== "editor" || !state.draft) return;
  const t = e.target, row = t.closest(".ed-ex");
  if (row && t.tagName === "SELECT"){ edList(row.dataset.w)[+row.dataset.i][t.dataset.f] = t.value; return; }
  if (t.dataset.dsel != null){ state.draft.days[+t.dataset.dsel].workout = t.value; return; }
  if (t.dataset.dx != null){ state.draft.days[+t.dataset.dx].extra = t.checked; return; }
  if (t.dataset.wname){ renderEditor(true); }
});

/* ---------- Ranking ---------- */
state.ranking = {}; state.rankMetric = "streak"; state.rankCol = null;
function evolutionPct(){
  const first = {}, last = {};
  loggedSessions().filter(s => !s.deload).forEach(s => {
    Object.entries(s.sets || {}).forEach(([id, arr]) => {
      const kg = maxHeavyKg(arr); if (kg == null || kg <= 0) return;
      if (!(id in first)) first[id] = {kg, date:s.date};
      last[id] = {kg, date:s.date};
    });
  });
  const vals = Object.keys(first).filter(id => last[id].date > first[id].date).map(id => (last[id].kg - first[id].kg) / first[id].kg * 100);
  return vals.length ? Math.round(vals.reduce((a, b) => a + b, 0) / vals.length) : 0;
}
function myStats(){
  const info = streakInfo(), today = isoToday(), month = today.slice(0, 7);
  const logged = loggedSessions();
  const dates = new Set(logged.map(s => s.date));
  const restored = new Set((state.config.restores || []).map(r => r.date));
  let planned = 0, hit = 0;
  const first = logged.length ? logged[0].date : today;
  for (let i = 1; i <= 28; i++){
    const d = addDays(today, -i); if (d < first) break;
    if (isRestDate(d)) continue;
    planned++; if (dates.has(d) || restored.has(d)) hit++;
  }
  if (dates.has(today) && !isRestDate(today)){ planned++; hit++; }
  return {streak:info.current, best:info.best, month:[...dates].filter(d => d.startsWith(month)).length, monthKey:month, freq:planned ? Math.round(hit / planned * 100) : 0, evo:evolutionPct()};
}
function statsKey(o){ return JSON.stringify([o.streak, o.best, o.month, o.monthKey, o.freq, o.evo]); }
function queueStats(){ clearTimeout(state.statsTimer); state.statsTimer = setTimeout(publishStats, 2500); }
async function publishStats(){
  if (state.mode !== "db" || !state.rankCol || !state.uid) return;
  const ref = state.rankCol.doc(state.uid);
  if (!state.config.ranking){
    if (state.ranking[state.uid]){ try{ await ref.delete(); }catch(e){} }
    return;
  }
  const st = myStats();
  const cur = state.ranking[state.uid];
  if (cur && statsKey(cur) === statsKey(st)) return;
  if (state.statsWriting){ state.statsAgain = true; return; }
  state.statsWriting = true;
  try{ await ref.set(Object.assign({uid:state.uid, updatedAt:new Date().toISOString()}, st)); state.rankErr = null; }
  catch(e){ state.rankErr = e && e.code || "erro"; if (state.view === "ranking") renderRanking(true); }
  finally{ state.statsWriting = false; if (state.statsAgain){ state.statsAgain = false; queueStats(); } }
}
function subscribeRanking(){
  state.rankCol.onSnapshot(snap => {
    const m = {};
    snap.docs.forEach(d => { const v = d.data(); if (v && typeof v === "object") m[d.id] = Object.assign({}, v, {uid:d.id}); });
    state.ranking = m;
    if (state.view === "ranking") renderRanking(true);
  }, () => {});
}
const METRICS = [
  {id:"streak", label:"Foguinho", val:r => +r.streak || 0, fmt:v => `${v} ${v === 1 ? "dia" : "dias"}`},
  {id:"month", label:"Treinos no mês", val:r => r.monthKey === isoToday().slice(0, 7) ? (+r.month || 0) : 0, fmt:v => `${v} ${v === 1 ? "treino" : "treinos"}`},
  {id:"freq", label:"Frequência", val:r => +r.freq || 0, fmt:v => `${v}%`},
  {id:"evo", label:"Evolução", val:r => +r.evo || 0, fmt:v => `${v > 0 ? "+" : ""}${v}%`}
];
const METRIC_HELP = {
  streak:"Dias seguidos de treino, contando os descansos planejados.",
  month:"Dias treinados neste mês.",
  freq:"Treinos feitos em relação aos planejados nos últimos 28 dias.",
  evo:"Quanto a carga das séries pesadas subiu, em média, desde o primeiro registro de cada exercício."
};
async function renderRanking(keep){
  const y = window.scrollY;
  main.classList.add("chat"); tabsEl.hidden = true;
  const avail = state.mode === "db" && state.rankCol;
  const m = METRICS.find(x => x.id === state.rankMetric) || METRICS[0];
  const rows = Object.values(state.ranking).filter(r => r && r.uid);
  rows.sort((a, b) => m.val(b) - m.val(a) || (+b.streak || 0) - (+a.streak || 0));
  let html = `<section class="summary"><h2>Ranking</h2><p class="when">Compare constância e evolução com seus amigos. As cargas de cada um continuam privadas: só estes números aparecem aqui.</p></section>`;
  if (!avail){
    html += `<div class="panel"><p class="mini">O ranking só funciona abrindo a ficha pelo Claude, com a sua conta.</p></div>`;
  } else {
    html += `<div class="panel rk-opt"><div><b>Aparecer no ranking</b><p class="mini">Mostra seu nome e seus números para quem tem acesso a esta ficha.</p></div>
      <button type="button" class="switch" role="switch" aria-checked="${!!state.config.ranking}" data-rkopt aria-label="Aparecer no ranking"><i></i></button></div>`;
    if (state.rankErr) html += `<p class="chat-note err">Não foi possível salvar seus números no ranking. Peça para quem compartilhou a ficha dar permissão de interagir.</p>`;
    html += `<div class="chips rk-metrics">${METRICS.map(x => `<button type="button" class="chip" data-rkm="${x.id}" aria-pressed="${x.id === m.id}">${x.label}</button>`).join("")}</div>
      <p class="mini rk-help">${METRIC_HELP[m.id]}</p>`;
    html += rows.length
      ? `<ol class="rank" id="rankList">${rows.map((r, i) => `<li class="${r.uid === state.uid ? "me" : ""}${i < 3 ? " top" + (i + 1) : ""}" data-uid="${esc(r.uid)}"><span class="pos">${i + 1}</span><span class="av"></span><span class="nm"></span><span class="vl"><b>${m.fmt(m.val(r))}</b><small>${r.updatedAt ? `atualizado ${fmtDate(String(r.updatedAt).slice(0, 10))}` : ""}</small></span></li>`).join("")}</ol>`
      : `<div class="panel"><p class="mini">Ninguém no ranking ainda. Ative "Aparecer no ranking" e chame seus amigos.</p></div>`;
    html += `<div class="panel"><h3>Chamar amigos</h3><ol class="steps">
      <li>Toque em <b>Compartilhar</b>, no topo da página do Claude, e convide seus amigos.</li>
      <li>Cada um abre a ficha com a própria conta do Claude e monta o treino em <b>Editar treino</b>.</li>
      <li>Quem ativar <b>Aparecer no ranking</b> entra na lista.</li></ol></div>`;
  }
  main.innerHTML = html;
  if (keep) window.scrollTo({top:y});
  const lis = [...document.querySelectorAll("#rankList li")];
  if (!lis.length) return;
  let ps = {};
  if (state.userCap && typeof state.userCap.profiles === "function"){ try{ ps = await state.userCap.profiles(rows.map(r => r.uid)) || {}; }catch(e){} }
  lis.forEach(li => {
    const p = ps[li.dataset.uid] || {}, me = li.dataset.uid === state.uid;
    li.querySelector(".nm").textContent = me ? `${p.name || "Você"} (você)` : (p.name || "Alguém");
    const av = li.querySelector(".av");
    if (p.avatarUrl){ const img = document.createElement("img"); img.src = p.avatarUrl; img.alt = ""; av.appendChild(img); }
    else av.textContent = ((me ? p.name || "Você" : p.name || "?").trim()[0] || "?").toUpperCase();
  });
}
main.addEventListener("click", e => {
  if (state.view !== "ranking") return;
  if (e.target.closest("[data-rkopt]")){
    state.config.ranking = !state.config.ranking;
    writeCfg(); publishStats(); renderRanking(true); return;
  }
  const mb = e.target.closest("[data-rkm]");
  if (mb){ state.rankMetric = mb.dataset.rkm; renderRanking(true); }
});

/* ---------- Navegação ---------- */
const viewsEl = document.getElementById("views");
const calBtn = document.getElementById("calBtn");
function setView(v){
  if (v !== "calendario" && v !== "editor") state.lastView = v;
  state.view = v;
  viewsEl.querySelectorAll("button[data-view]").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === v)));
  calBtn.setAttribute("aria-pressed", String(v === "calendario"));
  if (v === "analise"){ renderAnalysis(); if (chat.turns.length) scrollEnd(); else window.scrollTo({top:0}); }
  else if (v === "calendario"){ renderCalendar(false); }
  else if (v === "ranking"){ renderRanking(false); window.scrollTo({top:0}); }
  else if (v === "editor"){ renderEditor(false); window.scrollTo({top:0}); }
  else { render(); window.scrollTo({top:0}); }
}
viewsEl.addEventListener("click", e => { const b = e.target.closest("button[data-view]"); if (b && b.dataset.view !== state.view) setView(b.dataset.view); });
calBtn.addEventListener("click", () => setView(state.view === "calendario" ? (state.lastView || "treino") : "calendario"));

function onData(){
  updateFire();
  queueStats();
  if (state.view === "editor" || state.view === "ranking") return;
  if (state.view === "analise"){ updateAnalysisStats(); if (!chat.busy && !chat.turns.length) renderThread(); }
  else if (state.view === "calendario") renderCalendar(true);
  else if (state.renderedDeload !== deloadNow()) render();
  else refresh();
}

/* ---------- Início ---------- */
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !/claude\.ai|claudeusercontent/.test(location.hostname)){
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
loadCache();
loadCfg();
loadPlanCache();
applyAccent();
loadChat();
render();
updateFire();
connect();
loadSample();
})();
</script>
