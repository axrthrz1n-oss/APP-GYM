<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ficha de treino</title>
<meta name="description" content="Ficha de treino de musculação com registro de cargas, progressão automática, calendário, mapa muscular com patentes e foguinho de dias seguidos.">
<meta name="theme-color" content="#0A0D10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#EDF0F4; --line:#E0E4EA;
  --text:#12151B; --text-2:#5E6776; --accent:#2B6FEF; --on-accent:#FFFFFF;
  --success:#1E9E57; --warn:#B7791F; --danger:#D64541;
  --kb:#2F343D; --off-fl:#D5DAE1; --off-kb:#9AA1AD;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1115; --surface:#181B21; --surface-2:#232730; --line:#2C313B;
    --text:#F3F5F8; --text-2:#98A1B0; --accent:#4B8FFF; --on-accent:#FFFFFF;
    --success:#34C27A; --warn:#F2B544; --danger:#F0625D;
    --kb:#8E96A3; --off-fl:#3A404B; --off-kb:#666E7B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1115; --surface:#181B21; --surface-2:#232730; --line:#2C313B;
  --text:#F3F5F8; --text-2:#98A1B0; --accent:#4B8FFF; --on-accent:#FFFFFF;
  --success:#34C27A; --warn:#F2B544; --danger:#F0625D;
    --kb:#8E96A3; --off-fl:#3A404B; --off-kb:#666E7B;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-inner{max-width:640px;margin:0 auto;padding:10px 16px 12px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:2px 0 8px}
.app-title{flex:1;min-width:0;font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-actions{display:flex;align-items:center;gap:6px;flex:none}
.fire-btn{appearance:none;border:0;background:transparent;display:inline-flex;align-items:center;gap:2px;padding:4px 6px 4px 2px;border-radius:999px;cursor:pointer;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.fire-btn span{display:grid}
.fire-btn.on b{color:#FF6B1A}
.fire-btn.off b{color:var(--text-2)}
.fire .fl-o{fill:#FF6B1A}.fire .fl-i{fill:#FFD23F}.fire .kb{fill:var(--kb)}.fire .kb-h{stroke:var(--kb)}.fire .kb-hl{fill:#fff;opacity:.22}
.fire.lit{filter:drop-shadow(0 0 5px rgba(255,107,26,.45))}
.fire.off .fl-o,.fire.off .fl-i{fill:var(--off-fl)}.fire.off .kb{fill:var(--off-kb)}.fire.off .kb-h{stroke:var(--off-kb)}.fire.off .kb-hl{opacity:.15}
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet-bg[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;text-align:center}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet h2{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:6px 0 4px}
.sheet .sub{color:var(--text-2);font-size:15px;margin:0 auto 14px;max-width:34ch}
.sheet .box{background:var(--surface-2);border-radius:14px;padding:12px 14px;margin:10px 0;text-align:left;font-size:14.5px}
.sheet .kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0}
.sheet .kv span{color:var(--text-2)}
.sheet .mini{font-size:13px;color:var(--text-2);margin:6px 0 0}
.sheet ul{margin:6px 0 0;padding-left:18px;color:var(--text-2)}
.sheet li{margin:5px 0}
.dots{display:inline-flex;gap:6px}
.dots i{width:13px;height:13px;border-radius:50%;background:#FF6B1A}
.dots i.used{background:var(--line)}
.btn-fire{appearance:none;border:0;width:100%;border-radius:14px;background:#FF6B1A;color:#fff;font-size:16px;font-weight:700;padding:14px;cursor:pointer;margin:6px 0}
.btn-close{appearance:none;border:0;width:100%;border-radius:14px;background:var(--surface-2);font-size:15px;font-weight:650;padding:13px;cursor:pointer;margin-top:4px}
.day.restored .ds{border-color:#FF6B1A}
.cal-btn{appearance:none;flex:none;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:7px 14px 7px 12px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.cal-btn svg{width:16px;height:16px}
.cal-btn[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.subnav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2)}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--text-2)}
.status[data-k="saved"]::before{background:var(--success)}
.status[data-k="saving"]::before{background:var(--accent)}
.status[data-k="offline"]::before,.status[data-k="full"]::before{background:var(--danger)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:var(--surface-2);border-radius:11px;padding:3px}
.seg button{appearance:none;border:0;background:transparent;border-radius:8px;padding:6px 0 5px;cursor:pointer;line-height:1.15;position:relative}
.seg b{display:block;font-size:14px;font-weight:600}
.seg small{display:block;font-size:11.5px;color:var(--text-2)}
.seg button[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button[aria-selected="true"] small{color:var(--accent);font-weight:600}
.seg .today{position:absolute;top:5px;right:7px;width:5px;height:5px;border-radius:50%;background:var(--accent)}

main{max-width:640px;margin:0 auto;padding:16px 12px 150px}

/* Summary */
.summary{padding:6px 4px 18px}
.summary h2{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.1}
.summary .when{margin:4px 0 0;color:var(--text-2);font-size:15px}
.est{display:flex;align-items:center;gap:6px;margin:6px 0 0;font-size:14px;color:var(--text-2)}
.est svg{width:15px;height:15px}
.est b{color:var(--text);font-weight:650}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;gap:8px}
.stat span{display:block;font-size:13px;color:var(--text-2)}
.stat strong{display:block;font-size:19px;font-weight:700;margin-top:2px}
.progress{height:4px;border-radius:4px;background:var(--surface-2);margin-top:14px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);border-radius:4px;transition:width .3s ease}
.note{font-size:13.5px;color:var(--text-2);margin:12px 0 0}

/* Exercise card */
.ex{background:var(--surface);border-radius:16px;padding:14px 12px 10px;margin-bottom:10px}
.ex-head{display:flex;align-items:flex-start;gap:12px;padding:0 4px}
.badge{flex:none;width:38px;height:38px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--text-2)}
.ex-title{flex:1;min-width:0}
.ex h3{font-size:16.5px;font-weight:650;color:var(--accent);margin:1px 0 0;line-height:1.25}
.tip{font-size:13.5px;color:var(--text-2);margin:3px 0 0}
.pill{flex:none;font-size:12px;font-weight:650;padding:4px 9px;border-radius:999px;white-space:nowrap;margin-top:2px}
.pill:empty{display:none}
.pill.up{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.hit{background:color-mix(in srgb,var(--success) 18%,transparent);color:var(--success)}
.rest{appearance:none;border:0;background:none;padding:8px 4px 4px;margin-top:4px;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--accent);cursor:pointer}
.rest svg{width:15px;height:15px}

.grid{display:grid;grid-template-columns:46px minmax(0,1fr) 66px 56px 42px;align-items:center;column-gap:8px}
.cols{padding:10px 6px 6px;font-size:12.5px;color:var(--text-2)}
.cols span:nth-child(n+3){text-align:center}
.row{padding:5px 6px;border-radius:10px;transition:background-color .2s ease}
.row.done{background:color-mix(in srgb,var(--success) 16%,transparent)}
.c-set{display:flex;flex-direction:column;line-height:1.1}
.c-set b{font-size:15px;font-weight:700}
.c-set small{font-size:11px;color:var(--text-2);margin-top:2px}
.c-prev{font-size:14px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-prev .pr{display:inline-block;font-size:10.5px;font-weight:700;color:var(--warn);background:color-mix(in srgb,var(--warn) 18%,transparent);border-radius:5px;padding:1px 5px;margin-left:4px;vertical-align:1px}
.row input{width:100%;height:36px;border:0;border-radius:8px;background:var(--surface-2);color:var(--text);text-align:center;font:inherit;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;outline:none;padding:0 4px}
.row input::placeholder{color:var(--text-2);opacity:.55;font-weight:500}
.row input:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.row.done input{background:transparent}
.chk{appearance:none;width:36px;height:36px;border:0;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;cursor:pointer;justify-self:end;color:var(--text-2)}
.chk svg{width:18px;height:18px}
.chk[aria-pressed="true"]{background:var(--success);color:#fff}
.hint{font-size:12.5px;color:var(--text-2);padding:1px 6px 6px 60px;line-height:1.35}
.hint b{color:var(--accent);font-weight:650}
.hint.nexthint{border-style:dashed}
.ex.skipped .row,.ex.skipped .thead,.ex.skipped .hint,.ex.skipped [data-prog],.ex.skipped [data-unitfix]{opacity:.35;pointer-events:none}
.skipnote{margin:10px 0 0;font-size:13px;color:var(--text-2);background:var(--surface-2);border-radius:8px;padding:8px 10px}
.skipnote[hidden]{display:none}
.skip-link{margin-left:auto;margin-right:14px;color:var(--text-2)!important}
.day[data-iso],.yd[data-iso]{cursor:pointer}
.day[data-iso]:hover{filter:brightness(1.12)}
.yd[data-iso]:hover{outline:2px solid var(--text);outline-offset:1px}
.day-ex ul{list-style:none;padding:0;margin:6px 0 0}
.day-ex li{display:flex;flex-direction:column;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.day-ex li:last-child{border-bottom:0}
.day-ex li span{color:var(--text-2);font-size:13px}
.day-ex li b{color:var(--text);font-weight:650}
.day-ex,.day-coach{text-align:left}
.day-coach p{margin:6px 0 0;font-size:14px}
.day-coach ul{margin:6px 0 0}
.unitfix{margin:10px 0 0;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.45}
.unitfix[hidden]{display:none}
.unitfix p{margin:0}
.uf-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.uf-act button{appearance:none;border:1px solid var(--line);background:var(--surface-2);color:var(--text);border-radius:8px;padding:8px 12px;font:inherit;font-size:13.5px;font-weight:650;cursor:pointer}
.uf-act button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.hist .hconv{display:block;border-bottom:0;padding-top:4px}
.hist .hconv .link{font-size:13px;padding:2px 0}
.coach{background:var(--surface);border-radius:14px;padding:14px;margin:4px 0 14px}
.coach-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.coach-h b{display:block;font-family:var(--display);font-size:19px;letter-spacing:.02em;text-transform:uppercase}
.coach-h small{display:block;font-size:12.5px;color:var(--text-2)}
.coach-av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.coach-av svg{width:22px;height:22px}
.coach-thread{display:flex;flex-direction:column;gap:10px}
.cm{display:flex;flex-direction:column;max-width:88%}
.cm.u{align-self:flex-end;align-items:flex-end}
.cm.a{align-self:flex-start}
.cm-b{font-size:15px;line-height:1.5;padding:9px 12px;border-radius:14px}
.cm.u .cm-b{background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px;white-space:pre-wrap}
.cm.a .cm-b{background:var(--surface-2);border-bottom-left-radius:4px}
.cm-b p{margin:0 0 8px}.cm-b p:last-child{margin-bottom:0}
.cm-b ul,.cm-b ol{margin:0 0 8px;padding-left:20px}.cm-b li{margin:3px 0}
.cm-tag{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 4px 4px}
.coach-chips{padding:12px 0 0}
.coach-chips[hidden]{display:none}
.coach-ask{display:flex;align-items:flex-end;gap:8px;margin-top:12px}
.coach-ask textarea{flex:1;min-width:0;min-height:42px;max-height:124px;border:0;border-radius:12px;background:var(--surface-2);color:var(--text);font:inherit;font-size:16px;line-height:1.35;padding:10px 12px;resize:none;outline:none}
.coach-ask textarea:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.fin-coach{display:flex;align-items:center;gap:8px;justify-content:center;font-size:13.5px;color:var(--text-2);margin:10px 0 0}
.fin-coach svg{width:18px;height:18px;color:var(--accent);flex:none}
.notes-card{margin:4px 0 14px}
.notes-card textarea{display:block;width:100%;min-height:92px;border:0;border-radius:12px;background:var(--surface);color:var(--text);font:inherit;font-size:16px;line-height:1.45;padding:12px 14px;resize:vertical;outline:none}
.notes-card textarea:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.notes-card .mini{font-size:12.5px;color:var(--text-2);margin:6px 2px 0}
.note-reply{margin-top:10px;background:var(--surface);border-radius:12px;border-left:3px solid var(--accent);padding:12px 14px}
.nr-h{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.nr-b{font-size:15px;line-height:1.5}
.nr-b p{margin:0 0 8px}.nr-b p:last-child{margin-bottom:0}
.nr-b ul,.nr-b ol{margin:0 0 8px;padding-left:20px}.nr-b li{margin:3px 0}
.nr-wait{color:var(--text-2)}
.nr-stale{font-size:12.5px;color:var(--text-2);margin:8px 0 0}
.nr-err{font-size:14px;color:var(--danger);margin:0}
.nr-again{display:inline-block;margin-top:8px;font-size:13px;padding:2px 0}
.nr-q{margin:12px 0 8px auto;max-width:85%;width:fit-content;background:var(--surface-2);border-radius:12px 12px 4px 12px;padding:8px 12px;font-size:14.5px;white-space:pre-wrap}
.nr-ask{display:flex;align-items:flex-end;gap:8px;margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.nr-ask textarea{flex:1;min-width:0;min-height:40px;max-height:124px;border:0;border-radius:10px;background:var(--surface-2);color:var(--text);font:inherit;font-size:16px;line-height:1.35;padding:9px 12px;resize:none;outline:none}
.nr-ask textarea:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.nr-send{appearance:none;flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;cursor:pointer}
.nr-send svg{width:18px;height:18px}
.nr-send:disabled{opacity:.4;cursor:default}
.nr-foot:empty{display:none}
.prog{margin:8px 6px 0;padding:9px 12px;border-radius:10px;background:var(--surface-2);font-size:13.5px;line-height:1.4;color:var(--text-2)}
.prog:empty{display:none}
.prog b{color:var(--text);font-weight:650}
.prog.up b{color:var(--success)}
.prog.down b{color:var(--danger)}
.ex-foot{display:flex;justify-content:space-between;align-items:center;padding:6px 6px 2px}
.last{font-size:12.5px;color:var(--text-2)}
.link{appearance:none;border:0;background:none;padding:8px 0;font-size:13.5px;font-weight:600;color:var(--accent);cursor:pointer}
.hist{list-style:none;margin:2px 6px 6px;padding:0;border-top:1px solid var(--line)}
.hist li{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist .pct{font-family:var(--display);font-size:16px;font-weight:700;color:var(--text-2);text-align:right;min-width:48px;padding:2px 7px;border-radius:6px}
.hist .pct.up{color:var(--success);background:color-mix(in srgb,var(--success) 12%,transparent)}
.hist .pct.down{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}
.hist .pct.leve{color:var(--leve);background:color-mix(in srgb,var(--leve) 12%,transparent);font-family:var(--font);font-size:12px}
.hist .hsum{grid-template-columns:minmax(0,1fr) auto;font-weight:600}
.hist .hsum span{color:var(--text-2)}
.hist .hnote{display:block;border-bottom:0;font-size:12px;color:var(--text-2);padding-top:10px}
.hist .d{color:var(--text-2);font-variant-numeric:tabular-nums}
.hist .v{font-variant-numeric:tabular-nums}
.hist .empty{display:block;color:var(--text-2)}

.section{font-size:20px;font-weight:750;letter-spacing:-.01em;margin:22px 4px 10px}
.rules{background:var(--surface);border-radius:16px;padding:14px 16px;margin-top:22px}
.rules h3{font-size:16px;font-weight:700;margin:0 0 6px}
.rules ul{margin:0;padding-left:18px;color:var(--text-2);font-size:14px}
.rules li{margin:6px 0}
.rules b{color:var(--text);font-weight:600}

/* Rest timer */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.timer[hidden]{display:none}
.tbar{height:3px;background:var(--surface-2)}
.tbar i{display:block;height:100%;width:100%;background:var(--accent);transition:width .25s linear}
.timer.done .tbar i{background:var(--success)}
.timer-inner{max-width:640px;margin:0 auto;padding:10px 12px 12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:8px}
.tc{text-align:center}
.tc .t{font-size:30px;font-weight:750;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tc .l{font-size:12.5px;color:var(--text-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer.done .t{color:var(--success)}
.tbtn{appearance:none;border:0;border-radius:10px;background:var(--surface-2);padding:10px 11px;font-size:14px;font-weight:650;cursor:pointer;font-variant-numeric:tabular-nums}
.tbtn.primary{background:var(--accent);color:var(--on-accent)}
/* Views + analysis */
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.views{display:flex;gap:14px}
.views button{appearance:none;border:0;background:none;padding:2px 0;font-size:16.5px;font-weight:750;letter-spacing:-.01em;color:var(--text-2);cursor:pointer}
.views button[aria-selected="true"]{color:var(--text)}
.seg[hidden]{display:none}
main.chat{padding-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 4px 14px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-size:14px;cursor:pointer;text-align:left}
.chip:disabled{opacity:.5;cursor:default}
.thread{display:flex;flex-direction:column;gap:10px;padding:0 0 14px}
.thread-head{display:flex;justify-content:flex-end;padding:0 4px;margin-bottom:-4px}
.msg{font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;max-width:85%;background:var(--accent);color:var(--on-accent);padding:10px 14px;border-radius:18px 18px 6px 18px;white-space:pre-wrap}
.msg.bot{background:var(--surface);border-radius:16px;padding:12px 16px}
.msg.bot p{margin:0 0 8px}
.msg.bot > :last-child{margin-bottom:0}
.msg.bot .h{font-weight:700;margin-top:12px}
.msg.bot .h:first-child{margin-top:0}
.msg.bot ul,.msg.bot ol{margin:2px 0 10px;padding-left:20px}
.msg.bot li{margin:4px 0}
.thinking{color:var(--text-2)}
.chat-note{font-size:13.5px;color:var(--text-2);margin:0 4px 12px}
.chat-note.err{color:var(--danger)}
.composer{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;align-items:flex-end;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:5px 5px 5px 16px;box-shadow:0 6px 20px rgba(0,0,0,.10)}
body.timer-on .composer{bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}
.composer textarea{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font:inherit;font-size:16px;line-height:1.35;resize:none;outline:none;padding:8px 0;max-height:124px}
.composer textarea::placeholder{color:var(--text-2)}
.composer textarea:disabled{opacity:.6}
.send{appearance:none;border:0;width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;cursor:pointer;flex:none}
.send:disabled{opacity:.35;cursor:default}
.send svg{width:18px;height:18px}
.avail{font-size:13.5px;color:var(--text-2);margin:0 4px 12px}
/* Semana leve + calendário */
.banner{background:color-mix(in srgb,var(--warn) 14%,transparent);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:14px;line-height:1.4}
.banner b{color:var(--warn)}
.banner.info{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.banner.info b{color:var(--accent)}
.tag{display:inline-block;vertical-align:middle;margin-left:8px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn);letter-spacing:0}
.cycle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;font-size:14px;color:var(--text-2)}
.seg2{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg2 button{appearance:none;border:0;background:transparent;border-radius:8px;padding:6px 10px;font-size:13.5px;font-weight:600;color:var(--text-2);cursor:pointer}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.week{background:var(--surface);border-radius:16px;padding:12px;margin-bottom:10px;border:1.5px solid transparent}
.week.current{border-color:var(--accent)}
.week.deload{background:color-mix(in srgb,var(--warn) 10%,var(--surface))}
.wk-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 2px 10px}
.wk-head b{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.wtag{display:block;font-size:12px;font-weight:650;color:var(--accent);margin-top:1px}
.wtag.sug{color:var(--warn)}
.switch{appearance:none;border:0;background:none;display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);cursor:pointer;padding:4px 0;flex:none}
.switch i{width:40px;height:24px;border-radius:999px;background:var(--line);position:relative;transition:background-color .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"] i{background:var(--warn)}
.switch[aria-checked="true"] i::after{transform:translateX(16px)}
.switch[aria-checked="true"] span{color:var(--warn);font-weight:650}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.day{background:var(--surface-2);border-radius:10px;padding:8px 3px 7px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.day .dl{font-size:13px;font-weight:700}
.day .dw{font-size:11px;color:var(--text-2);line-height:1.2;overflow-wrap:anywhere}
.day .ds{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;margin-top:4px;border:1.5px solid var(--line)}
.day .ds svg{width:12px;height:12px}
.day.done .ds{background:var(--success);border-color:var(--success);color:#fff}
.day.miss{opacity:.45}
.day.today{box-shadow:inset 0 0 0 2px var(--accent)}

/* ================= Identidade própria ================= */
:root{
  --accent:var(--acc-l,#E0560E); --on-accent:var(--acc-on,#FFFFFF); --leve:#1E9A8C;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --font:"Barlow",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --bg:#F4F4F5; --surface:#FFFFFF; --surface-2:#EDEDEF; --line:#DEDEE2; --text:#141416; --text-2:#62636B;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --accent:var(--acc-d,#FF7A2F); --on-accent:var(--acc-on,#FFFFFF); --leve:#3CC4B3; --bg:#111113; --surface:#1A1A1D; --surface-2:#252529; --line:#313136; --text:#F4F4F5; --text-2:#9D9DA6; }
}
:root[data-theme="dark"]{ --accent:var(--acc-d,#FF7A2F); --on-accent:var(--acc-on,#FFFFFF); --leve:#3CC4B3; --bg:#111113; --surface:#1A1A1D; --surface-2:#252529; --line:#313136; --text:#F4F4F5; --text-2:#9D9DA6; }

/* cabeçalho */
.app-title{font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:.01em;text-transform:uppercase}
.brand-actions{gap:5px}
.cal-btn{font-size:13.5px;padding:7px 10px;gap:6px}
.pal-btn{appearance:none;width:34px;height:34px;flex:none;border:1px solid var(--line);border-radius:8px;background:transparent;display:grid;place-items:center;cursor:pointer}
.pal-btn i{width:16px;height:16px;border-radius:50%;background:var(--accent)}
.theme-btn{color:var(--text)}
@media (max-width:440px){ .cal-t{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap} .cal-btn{padding-left:9px;padding-right:9px} }
.theme-btn svg{width:17px;height:17px}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 18px}
.seg3 button{appearance:none;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:10px;padding:10px 6px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.seg3 button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.swatches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 8px;margin:14px 0 6px}
.swatch{appearance:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--text-2);cursor:pointer;padding:0}
.swatch i{width:46px;height:46px;border-radius:50%;background:var(--sl);display:grid;place-items:center;color:var(--son,#fff)}
.swatch i svg{width:20px;height:20px;opacity:0}
.swatch[aria-pressed="true"]{color:var(--text);font-weight:650}
.swatch[aria-pressed="true"] i{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--sl)}
.swatch[aria-pressed="true"] i svg{opacity:1}
.custom{display:flex;align-items:center;justify-content:space-between;gap:12px}
.custom input[type=color]{appearance:none;-webkit-appearance:none;width:46px;height:34px;border:1px solid var(--line);border-radius:8px;background:transparent;padding:2px;cursor:pointer}
.custom input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.custom input[type=color]::-webkit-color-swatch{border:0;border-radius:6px}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .swatch i{background:var(--sd)} :root:not([data-theme="light"]) .swatch[aria-pressed="true"] i{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--sd)} }
:root[data-theme="dark"] .swatch i{background:var(--sd)}
:root[data-theme="dark"] .swatch[aria-pressed="true"] i{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--sd)}
.views{gap:18px}
.views button{font-family:var(--display);font-size:19px;font-weight:600;padding:0 0 3px;border-bottom:2px solid transparent;letter-spacing:.01em}
.views button[aria-selected="true"]{border-bottom-color:var(--accent)}
.cal-btn{border-radius:8px;padding:7px 12px}
.cal-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.seg{background:transparent;padding:0;gap:6px}
.seg button{border:1px solid var(--line);border-radius:8px;padding:6px 0 5px;background:var(--surface)}
.seg b{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:.02em}
.seg button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);box-shadow:none;color:var(--on-accent)}
.seg button[aria-selected="true"] b{color:var(--on-accent)}
.seg button[aria-selected="true"] small{color:rgba(255,255,255,.88)}
.seg .today{background:var(--accent)}
.seg button[aria-selected="true"] .today{background:#fff}

/* resumo do dia */
.summary h2{font-family:var(--display);font-size:46px;font-weight:700;text-transform:uppercase;letter-spacing:.005em;line-height:.98}
.stats{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;gap:0}
.stat{padding:0 12px;border-left:1px solid var(--line)}
.stat:first-child{padding-left:0;border-left:0}
.stat strong{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:.01em}
.progress{height:3px;border-radius:0}
.progress i{border-radius:0}

/* exercícios */
.ex{border-radius:10px;border:1px solid var(--line);padding:14px 12px 10px}
.badge{background:none;width:auto;height:auto;min-width:34px;display:block;font-family:var(--display);font-size:30px;font-weight:700;line-height:.95;color:var(--accent);text-align:left}
.ex h3{color:var(--text);font-size:17px;font-weight:650}
.rest{color:var(--text-2)}
.rest svg{color:var(--accent)}
.cols{font-family:var(--display);font-size:14px;letter-spacing:.02em}
.row{border-radius:0;border-left:3px solid transparent;padding-left:5px}
.row.done{background:color-mix(in srgb,var(--accent) 10%,transparent);border-left-color:var(--accent)}
.c-set b{font-family:var(--display);font-size:21px;font-weight:700}
.row input{background:transparent;border-radius:0;border-bottom:2px solid var(--line);font-family:var(--display);font-size:23px;font-weight:700;height:38px;padding-top:4px}
.row input:focus{box-shadow:none;border-bottom-color:var(--accent)}
.row.done input{border-bottom-color:transparent}
.chk{border-radius:50%;background:transparent;border:2px solid var(--line)}
.chk[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.prog{background:transparent;border-radius:0;border-left:3px solid var(--line);padding:3px 10px;margin-left:8px}
.prog.up{border-left-color:var(--success)}
.prog.down{border-left-color:var(--danger)}
.section{font-family:var(--display);font-size:26px;font-weight:700;text-transform:uppercase}
.rules{border-radius:10px;border:1px solid var(--line)}

/* semana leve em outra cor, para não confundir com o laranja */
.banner{background:color-mix(in srgb,var(--leve) 14%,transparent)}
.banner b{color:var(--leve)}
.banner.info{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.banner.info b{color:var(--accent)}
.tag{background:color-mix(in srgb,var(--leve) 18%,transparent);color:var(--leve);font-family:var(--font)}
.switch[aria-checked="true"] i{background:var(--leve)}
.switch[aria-checked="true"] span{color:var(--leve)}
.week{border-radius:10px;border:1px solid var(--line)}
.week.current{border:1.5px solid var(--accent)}
.week.deload{background:color-mix(in srgb,var(--leve) 10%,var(--surface))}
.wtag.sug{color:var(--leve)}
.wk-head b{font-family:var(--display);font-size:18px}
.day{border-radius:8px}
.day .dl{font-family:var(--display);font-size:17px}
.day.done .ds{background:var(--accent);border-color:var(--accent)}

/* cronômetro, análise e painéis */
.tc .t{font-family:var(--display);font-size:40px;font-weight:700}
.tbtn{border-radius:8px}
.timer.done{border-top-color:var(--success)}
.panel,.msg.bot{border-radius:10px}
.chip{border-radius:8px}
.composer{border-radius:12px}
.send{border-radius:10px}
.sheet h2{font-family:var(--display);font-size:32px;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.btn-fire,.btn-close{border-radius:10px}
/* caixinhas da sugestão e do "Hoje" */
.hint{margin:4px 6px 8px;padding:8px 11px;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:8px;color:var(--text-2)}
.prog{margin:10px 6px 2px;padding:9px 12px;border:1px solid var(--line);border-left-width:1px;background:var(--surface-2);border-radius:8px}
.prog.up{border-color:color-mix(in srgb,var(--success) 50%,transparent);background:color-mix(in srgb,var(--success) 9%,transparent)}
.prog.down{border-color:color-mix(in srgb,var(--danger) 50%,transparent);background:color-mix(in srgb,var(--danger) 9%,transparent)}

/* ================= Estrutura estilo pulseira ================= */
:root{ --bg:#EEF1F3; --surface:#FFFFFF; --surface-2:#E8ECEF; --line:#D6DCE1; --text:#0E1316; --text-2:#5C6972; --success:#16A55A; --time:#1C7ED6; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0A0D10; --surface:#141A1F; --surface-2:#1D252B; --line:#27313A; --text:#F5F7F8; --text-2:#8796A1; --success:#35D07F; --time:#4DABF7; }
}
:root[data-theme="dark"]{ --bg:#0A0D10; --surface:#141A1F; --surface-2:#1D252B; --line:#27313A; --text:#F5F7F8; --text-2:#8796A1; --success:#35D07F; --time:#4DABF7; }
.top{border-bottom:0}
.top-inner{padding:10px 16px 10px}
.brand{align-items:center;margin:2px 0 8px}
.hd{min-width:0;flex:1}
.eyebrow{display:block;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text-2);margin-bottom:1px}
.app-title{font-size:clamp(18px,5.4vw,23px);letter-spacing:.01em}
.fire-btn{padding-right:3px}
.brand-actions{gap:5px}
.seg{gap:4px}
.seg button{border:0;background:var(--surface);border-radius:10px}
.seg b{font-family:var(--font);font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.seg small{font-size:11px}
main{padding-bottom:190px}
main.chat{padding-bottom:96px}
.hd{min-width:0;flex:1;display:flex;flex-direction:column}
.hd .status{font-size:11.5px;margin-top:2px}
.timer{bottom:calc(60px + env(safe-area-inset-bottom,0px));padding-bottom:0;z-index:14}
.composer{bottom:calc(env(safe-area-inset-bottom,0px) + 72px)}

/* anéis */
.summary{padding:4px 2px 14px}
.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0 18px}
.ring{text-align:center}

.summary h2{font-size:30px}
.wk-title .est{margin-top:4px}
/* cards */

.badge{font-family:var(--font);font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--text-2);min-width:26px;padding-top:3px}
.ex h3{font-size:15px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.cols{font-family:var(--font);font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.row input{background:var(--surface-2);border-bottom:0;border-radius:8px;font-size:21px}

.rules{border:0}

.week{border:0}
.stats{border:0;background:var(--surface);border-radius:14px;padding:12px 14px}
.stat span{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
/* barra de navegação inferior */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav-in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);padding:6px 8px}

.tbar2{height:4px;border-radius:4px;background:var(--surface-2);margin-top:9px;overflow:hidden}
.tbar2 i{display:block;height:100%;width:0;border-radius:4px;background:var(--accent);transition:width .4s ease}
/* visão do ano */
.year{background:var(--surface);border-radius:14px;padding:14px;margin:4px 0 8px}
.yhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.yhead h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text-2)}
.ynav{display:flex;align-items:center;gap:10px}
.ynav b{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}

#avatarBody .mini{font-size:12.5px;color:var(--text-2);margin:6px 0 0}
/* análise fora do Claude */
.qbox{width:100%;border:0;border-radius:10px;background:var(--surface-2);color:var(--text);font:inherit;font-size:16px;line-height:1.4;padding:11px 12px;resize:vertical;min-height:52px;outline:none}
.qbox:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.actions .btn.primary{flex:1}
.ok{font-size:14px;color:var(--success);margin:12px 0 0}
.ok.err{color:var(--danger)}
.chip[data-oq][aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
/* conta na nuvem */
.hd-sub{display:flex;align-items:center;gap:10px;min-width:0;margin-top:2px}
.hd-sub .status{margin-top:0}
.acct-btn{appearance:none;border:0;background:none;padding:2px 0;font:inherit;font-size:11.5px;font-weight:700;color:var(--accent);cursor:pointer;white-space:nowrap}
.acct-in{display:block;width:100%;border:0;border-radius:10px;background:var(--surface-2);color:var(--text);font:inherit;font-size:16px;padding:12px 14px;margin:6px 0 10px;outline:none;text-align:left}
.acct-in:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.acct-in.code{font-size:22px;letter-spacing:.3em;text-align:center}
#acctBody .btn{width:100%;margin-top:2px}
#acctBody .link{display:block;margin:6px auto 0}
#acctBody .ok{text-align:center}
/* Plano Pro */
.pro-plans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 12px}
.pro-plan{position:relative;background:var(--surface-2);border:2px solid transparent;border-radius:14px;padding:16px 10px 12px;text-align:center}
.pro-plan.best{border-color:var(--accent)}
.pro-plan b{display:block;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-2)}
.pro-plan strong{display:block;font-family:var(--display);font-size:30px;font-weight:700;margin:4px 0 0;color:var(--text)}
.pro-plan small{display:block;font-size:12.5px;color:var(--text-2)}
.pro-tag{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.sheet .pro-list{list-style:none;margin:8px 0 0;padding:0;text-align:left;color:var(--text)}
.sheet .pro-list li{position:relative;padding-left:20px;margin:8px 0;font-size:14.5px;line-height:1.4}
.sheet .pro-list li::before{content:"";position:absolute;left:3px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
#proBody .btn{width:100%}
.pro-trial{font-size:15px;color:var(--text-2);margin:16px 0 0}
.pro-trial b{color:var(--accent)}
#proBody .btn:disabled,#acctBody .btn:disabled{opacity:.5;cursor:default}
#acctBody .kv b{color:var(--text)}
.pro-cta{font-size:13px;color:var(--text-2);margin:8px 2px 0}
.pro-cta .link{padding:0}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="hd"><h1 class="app-title">Ficha de treino</h1><div class="hd-sub"><span class="status" id="status" data-k="loading" role="status">Conectando…</span><button type="button" class="acct-btn" id="acctBtn" hidden>Entrar</button></div></div>
      <div class="brand-actions">
      <button type="button" class="fire-btn off" id="fireBtn" aria-label="Foguinho"><span id="fireIcon"></span><b id="fireN">0</b></button>
      <button type="button" class="pal-btn" id="palBtn" aria-label="Aparência: tema e cor"><i></i></button>
      <button type="button" class="pal-btn theme-btn" id="themeBtn" aria-label="Alternar tema claro e escuro"></button>
      <button type="button" class="cal-btn" id="calBtn" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span class="cal-t">Calendário</span></button>
      </div>
    </div>
    <nav class="seg" id="tabs" role="tablist" aria-label="Dias da semana"></nav>
  </div>
</header>
<main id="app"></main>
<div class="sheet-bg" id="colorSheet" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="colorTitle" id="colorBody"></div></div>
<div class="sheet-bg" id="finishSheet" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="finTitle" id="finishBody"></div></div>
<div class="sheet-bg" id="proSheet" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="proTitle" id="proBody"></div></div>
<div class="sheet-bg" id="acctSheet" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="acctTitle" id="acctBody"></div></div>
<div class="sheet-bg" id="fireSheet" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="fireTitle" id="fireBody"></div></div>
<div class="timer" id="timer" hidden>
  <div class="tbar"><i id="tProg"></i></div>
  <div class="timer-inner">
    <button class="tbtn" type="button" id="tMinus" aria-label="Diminuir 15 segundos">−15s</button>
    <div class="tc"><div class="t" id="tTime">0:00</div><div class="l" id="tLabel">Descanso</div></div>
    <button class="tbtn" type="button" id="tPlus" aria-label="Aumentar 15 segundos">+15s</button>
    <button class="tbtn primary" type="button" id="tSkip">Pular</button>
  </div>
</div>
<nav class="bnav" id="views" aria-label="Seções">
  <div class="bnav-in">
    <button type="button" data-view="treino" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg><span>Treino</span></button>
    <button type="button" data-view="shape" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="4.5" r="2.2"/><path d="M6 9.5c2-1.2 4-1.7 6-1.7s4 .5 6 1.7M9 8.6l.6 6.2-1.6 6.7M15 8.6l-.6 6.2 1.6 6.7M9.6 14.8h4.8"/></svg><span>Shape</span></button>
    <button type="button" data-view="analise" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l3.5-4 3 2.5L19 8"/></svg><span>Análise</span></button>
  </div>
</nav>
<script src="config.js"></script>
<script src="cloud.js"></script>
<script>
(function(){
"use strict";

/* ---------- Plano ---------- */
const A = n => Array.from({length:n}, (_, i) => i === 0 ? {goal:12, label:"10–12"} : {goal:8, label:"até 8"});
const B = n => Array.from({length:n}, (_, i) => i === 0 ? {goal:15, label:"12–15"} : {goal:12, label:"10–12"});
/* pirâmide invertida: 1ª pesada, depois 10–15% mais leve a cada série, a última até não aguentar */
const P = n => Array.from({length:n}, (_, i) => i === 0 ? {goal:12, label:"8–12"} : i === n - 1 ? {goal:20, label:"até não aguentar"} : {goal:15, label:"12–15"});
/* o mesmo exercício pode estar em treinos diferentes: vale a versão do dia aberto */
const exOf = exId => (typeof dayExercises === "function" && dayExercises().find(e => e.id === exId)) || EX_INDEX[exId];
const isPyr = exId => !!((exOf(exId) || {}).pyramid);
const heavyIdx = ex => ex.pyramid ? [0] : ex.sets.map((_, i) => i).slice(1);
const heavyPart = (exId, arr) => Array.isArray(arr) ? (isPyr(exId) ? arr.slice(0, 1) : arr.slice(1)) : [];
const HEAVY = {rest:"2–3 min", restSec:150};
const LIGHT = {rest:"1–1,5 min", restSec:75};

const WORKOUTS = {
  push: {name:"Push", exercises:[
    {id:"supino-reto-deitado", name:"Supino reto máquina (deitado)", sets:A(3), ...HEAVY, tip:"Escápulas encaixadas; desça em 2–3 s até alongar bem o peito, sem dor no ombro"},
    {id:"supino-inclinado", name:"Supino inclinado máquina", sets:A(3), ...HEAVY},
    {id:"crossover", name:"Crossover", sets:A(3), ...LIGHT, tip:"Puxar de cima para baixo"},
    {id:"elevacao-lateral", name:"Elevação lateral", sets:B(3), ...LIGHT},
    {id:"crucifixo-invertido", name:"Crucifixo invertido", sets:B(3), ...LIGHT, tip:"No voador, sentado de frente para o encosto"},
    {id:"triceps-frances-polia", name:"Tríceps francês na polia", sets:B(3), ...LIGHT, tip:"Corda na polia alta, de costas; cotovelos parados apontando para frente, desça até alongar bem"},
    {id:"triceps-pulley", name:"Tríceps pulley", sets:A(3), ...LIGHT}
  ]},
  pull: {name:"Pull A", exercises:[
    {id:"puxada-alta", name:"Puxada alta", sets:A(3), ...HEAVY, tip:"Levar os cotovelos em direção aos bolsos"},
    {id:"remada-articulada", name:"Remada articulada máquina", sets:A(3), ...HEAVY, tip:"Pegada pronada, cotovelos abertos"},
    {id:"remada-baixa", name:"Remada baixa", sets:A(3), ...HEAVY, tip:"Pegada neutra e fechada, cotovelos colados, puxar para o quadril"},
    {id:"elevacao-lateral", name:"Elevação lateral", sets:B(3), ...LIGHT},
    {id:"scott", name:"Scott", sets:A(3), ...LIGHT},
    {id:"rosca-bayesian", name:"Rosca bayesian", sets:A(3), ...LIGHT},
    {id:"rosca-inversa", name:"Rosca inversa na polia", sets:B(3), ...LIGHT}
  ]},
  pullB: {name:"Pull B", exercises:[
    {id:"romana-aberta", name:"Puxada romana aberta", sets:A(3), ...HEAVY, tip:"Pegada neutra; levar os cotovelos em direção aos bolsos"},
    {id:"remada-articulada", name:"Remada articulada máquina", sets:A(3), ...HEAVY, tip:"Pegada pronada, cotovelos abertos"},
    {id:"puxada-unilateral", name:"Puxada articulada unilateral", sets:A(3), ...HEAVY, tip:"3 séries de cada lado, alternando sem descanso. Anote as reps do lado mais fraco"},
    {id:"elevacao-lateral", name:"Elevação lateral", sets:B(3), ...LIGHT},
    {id:"scott", name:"Scott", sets:A(3), ...LIGHT},
    {id:"rosca-bayesian", name:"Rosca bayesian", sets:A(3), ...LIGHT},
    {id:"rosca-punho", name:"Rosca de punho", sets:P(3), pyramid:true, ...LIGHT, tip:"Pirâmide invertida. Antebraço apoiado, palma para cima; deixe descer até a ponta dos dedos"}
  ]},
  legs: {name:"Legs", exercises:[
    {id:"hack", name:"Hack", sets:A(3), ...HEAVY, tip:"Opcional: parar 1 rep antes da falha"},
    {id:"leg-press", name:"Leg press", sets:A(3), ...HEAVY, tip:"Opcional: parar 1 rep antes da falha"},
    {id:"cadeira-flexora", name:"Cadeira flexora", sets:A(3), ...LIGHT},
    {id:"mesa-flexora", name:"Mesa flexora", sets:A(3), ...LIGHT, tip:"Quadril colado no banco; desça em 2–3 s até esticar quase toda a perna"},
    {id:"panturrilha", name:"Panturrilha em pé", sets:A(2), ...LIGHT, tip:"Joelho esticado"},
    {id:"panturrilha-sentado", name:"Panturrilha sentado", sets:A(2), ...LIGHT, tip:"Joelho dobrado"}
  ]}
};
const EXTRA = {name:"Abdômen", exercises:[{id:"abdomen", name:"Máquina de abdômen", sets:B(3), rest:"1 min", restSec:60, tip:"No final do treino"}]};

const DAYS = [
  {label:"Seg", full:"Segunda", workout:"push", abs:true},
  {label:"Ter", full:"Terça", workout:"pull", abs:false},
  {label:"Qua", full:"Quarta", workout:"legs", abs:true},
  {label:"Qui", full:"Quinta", workout:"push", abs:false},
  {label:"Sex", full:"Sexta", workout:"pullB", abs:true},
  {label:"Sáb", full:"Sábado", workout:null, abs:false},
  {label:"Dom", full:"Domingo", workout:null, abs:false}
];
const WEEKDAY = ["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
/* exercícios que saíram do plano: continuam com nome certo no histórico, na análise e no Shape */
const RETIRED = [{id:"supino-reto", name:"Supino reto máquina (sentado)", sets:A(3), ...HEAVY}, {id:"triceps-testa", name:"Tríceps testa máquina", sets:B(3), ...LIGHT}, {id:"extensora", name:"Extensora", sets:A(3), ...LIGHT}];
const EX_INDEX = {};
function rebuildIndex(){
  Object.keys(EX_INDEX).forEach(k => delete EX_INDEX[k]);
  Object.values(WORKOUTS).forEach(w => w.exercises.forEach(e => { EX_INDEX[e.id] = e; }));
  EXTRA.exercises.forEach(e => { EX_INDEX[e.id] = e; });
  RETIRED.forEach(e => { if (!EX_INDEX[e.id]) EX_INDEX[e.id] = e; });
}
rebuildIndex();

/* ---------- Plano editável ---------- */
const REST = {heavy:{label:"2–3 min", sec:150}, light:{label:"1–1,5 min", sec:75}, short:{label:"1 min", sec:60}};
function restKey(sec){ return sec >= 150 ? "heavy" : sec >= 75 ? "light" : "short"; }
function exToPlan(e){ return {id:e.id, name:e.name, scheme:e.pyramid ? "P" : e.sets[0].goal === 15 ? "B" : "A", sets:e.sets.length, rest:restKey(e.restSec), tip:e.tip || ""}; }
function runtimeToPlan(){
  const workouts = {};
  Object.entries(WORKOUTS).forEach(([k, w]) => { workouts[k] = {name:w.name, exercises:w.exercises.map(exToPlan)}; });
  return {version:1, workouts, days:DAYS.map(d => ({workout:d.workout || "", extra:!!d.abs})), extra:{name:EXTRA.name, exercises:EXTRA.exercises.map(exToPlan)}};
}
const DEFAULT_PLAN = runtimeToPlan();
function slugify(t){ return String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60); }
function cleanEx(e){
  if (!e || typeof e !== "object") return null;
  const name = String(e.name || "").trim().slice(0, 80); if (!name) return null;
  const id = /^[a-z0-9-]{1,80}$/.test(e.id || "") ? e.id : (slugify(name) || "ex-" + Math.random().toString(36).slice(2, 8));
  return {id, name, scheme:e.scheme === "B" || e.scheme === "P" ? e.scheme : "A", sets:Math.min(6, Math.max(1, +e.sets || 3)), rest:REST[e.rest] ? e.rest : "light", tip:String(e.tip || "").trim().slice(0, 140)};
}
function normalizePlan(p){
  if (!p || typeof p !== "object" || !p.workouts || typeof p.workouts !== "object") return null;
  const workouts = {};
  Object.entries(p.workouts).slice(0, 12).forEach(([k, w]) => {
    if (!/^[A-Za-z0-9_-]{1,40}$/.test(k) || !w) return;
    workouts[k] = {name:String(w.name || "Treino").trim().slice(0, 40) || "Treino", exercises:(Array.isArray(w.exercises) ? w.exercises : []).map(cleanEx).filter(Boolean).slice(0, 20)};
  });
  const days = [0, 1, 2, 3, 4, 5, 6].map(i => { const d = Array.isArray(p.days) ? p.days[i] || {} : {}; return {workout:workouts[d.workout] ? d.workout : "", extra:!!d.extra}; });
  const ex = p.extra && typeof p.extra === "object" ? p.extra : {};
  return {version:1, workouts, days, extra:{name:String(ex.name || "Complemento").trim().slice(0, 40) || "Complemento", exercises:(Array.isArray(ex.exercises) ? ex.exercises : []).map(cleanEx).filter(Boolean).slice(0, 10)}};
}
function planToEx(e){ const r = REST[e.rest] || REST.light; const x = {id:e.id, name:e.name, sets:e.scheme === "P" ? P(e.sets) : e.scheme === "B" ? B(e.sets) : A(e.sets), rest:r.label, restSec:r.sec, tip:e.tip || undefined}; if (e.scheme === "P") x.pyramid = true; return x; }
function applyPlan(p){
  Object.keys(WORKOUTS).forEach(k => delete WORKOUTS[k]);
  Object.entries(p.workouts).forEach(([k, w]) => { WORKOUTS[k] = {name:w.name, exercises:w.exercises.map(planToEx)}; });
  DAYS.forEach((d, i) => { const pd = p.days[i] || {}; d.workout = WORKOUTS[pd.workout] ? pd.workout : null; d.abs = !!pd.extra; });
  EXTRA.name = p.extra.name; EXTRA.exercises = p.extra.exercises.map(planToEx);
  rebuildIndex();
}
/* quem entra pela primeira vez (e não é o dono da ficha) começa com o plano vazio */
const BLANK_PLAN = {version:1, workouts:{}, days:[0, 1, 2, 3, 4, 5, 6].map(() => ({workout:"", extra:false})), extra:{name:"Abdômen", exercises:[]}};
function currentPlan(){ return state.plan || (state.blank ? BLANK_PLAN : DEFAULT_PLAN); }
function workoutName(key){ return WORKOUTS[key] ? WORKOUTS[key].name : key === "extra" ? EXTRA.name : (key || ""); }
function dayName(d){ return d.workout && WORKOUTS[d.workout] ? WORKOUTS[d.workout].name : d.abs && EXTRA.exercises.length ? EXTRA.name : "Descanso"; }
function dayTitle(d){
  const w = d.workout && WORKOUTS[d.workout];
  if (w) return w.name + (d.abs && EXTRA.exercises.length ? ` e ${EXTRA.name.toLowerCase()}` : "");
  return d.abs && EXTRA.exercises.length ? EXTRA.name : "Descanso";
}
/* índice do dia na semana: 0 = segunda ... 6 = domingo */
const dayIdx = iso => (parseISO(iso).getDay() + 6) % 7;
function dayPlanned(i){ const d = DAYS[i]; return !!(d && d.workout && WORKOUTS[d.workout]) || !!(d && d.abs && EXTRA.exercises.length); }
function isRestDate(iso){ return !dayPlanned(dayIdx(iso)); }
function trainDaysText(){
  const list = DAYS.filter((d, i) => dayPlanned(i)).map(d => d.full.toLowerCase());
  return list.length ? list.join(", ") : "nenhum dia definido ainda";
}

const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const ICON_CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5"/></svg>';

/* ---------- Estado ---------- */
const CACHE_KEY = "ficha-treino-v1";
const state = {
  sessions:{}, dirty:new Set(), ver:{}, timers:{}, writing:{}, again:{},
  day:0, mode:"loading", col:null, unsub:null, firstSnap:false, resubscribed:false, open:new Set(),
  view:"treino"
};
const pad = n => String(n).padStart(2, "0");
function isoToday(){ const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function fmtDate(iso){ const p = String(iso || "").split("-"); return p.length === 3 ? `${p[2]}/${p[1]}` : ""; }
function fmtKg(v){ return v == null ? "" : String(v).replace(".", ","); }
function parseNum(s){ s = String(s).trim().replace(",", "."); if (!s) return null; const n = Number(s); return Number.isFinite(n) && n >= 0 ? n : null; }
function curId(){ return `${isoToday()}_${DAYS[state.day].workout || "extra"}`; }
function hasData(arr){ return Array.isArray(arr) && arr.some(s => s && (s.kg != null || s.reps != null)); }
function dayExercises(){ const d = DAYS[state.day]; const w = d.workout && WORKOUTS[d.workout]; return (w ? w.exercises : []).concat(d.abs ? EXTRA.exercises : []); }

/* ---------- Semana leve ---------- */
const CFG_KEY = "ficha-config-v1";
const ACCENTS = [
  {id:"laranja", name:"Laranja", l:"#E0560E", d:"#FF7A2F", on:"#FFFFFF"},
  {id:"vermelho", name:"Vermelho", l:"#D62D3A", d:"#FF5A5F", on:"#FFFFFF"},
  {id:"rosa", name:"Rosa", l:"#CF2F78", d:"#FF6BA8", on:"#FFFFFF"},
  {id:"roxo", name:"Roxo", l:"#7B3FE4", d:"#A487FF", on:"#FFFFFF"},
  {id:"azul", name:"Azul", l:"#1F6FEB", d:"#4C9AFF", on:"#FFFFFF"},
  {id:"ciano", name:"Ciano", l:"#08869E", d:"#2EC5E0", on:"#FFFFFF"},
  {id:"verde", name:"Verde", l:"#1C8F45", d:"#3DD174", on:"#FFFFFF"},
  {id:"amarelo", name:"Amarelo", l:"#B98500", d:"#FFC83D", on:"#141416"}
];
state.config = {deloadWeeks:[], cycle:6, restores:[], accent:{id:"laranja"}};
state.cfgRef = null; state.cfgWriting = false; state.cfgAgain = false; state.cfgDirty = false;
function applyCfg(c){
  state.config = {
    deloadWeeks: Array.isArray(c && c.deloadWeeks) ? c.deloadWeeks.filter(x => typeof x === "string" && /^\d{4}-\d{2}-\d{2}$/.test(x)).sort() : [],
    cycle: c && c.cycle === 8 ? 8 : 6,
    accent: c && c.accent && typeof c.accent === "object" && (ACCENTS.some(a => a.id === c.accent.id) || /^#[0-9a-fA-F]{6}$/.test(c.accent.custom || "")) ? (c.accent.custom ? {custom:c.accent.custom} : {id:c.accent.id}) : {id:"laranja"},
    ranking: !!(c && c.ranking),
    theme: c && (c.theme === "light" || c.theme === "dark") ? c.theme : "auto",
    avatar: c && c.avatar && typeof c.avatar === "object" ? cleanAvatar(c.avatar) : null,
    unitOk: c && c.unitOk && typeof c.unitOk === "object" ? Object.fromEntries(Object.entries(c.unitOk).filter(([k, v]) => /^[a-z0-9-]{1,80}$/.test(k) && /^\d{4}-\d{2}-\d{2}$/.test(v)).slice(-60)) : {},
    shareLoads: !!(c && c.shareLoads),
    shareShape: !!(c && c.shareShape),
    restores: Array.isArray(c && c.restores) ? c.restores.filter(r => r && /^\d{4}-\d{2}-\d{2}$/.test(r.date) && /^\d{4}-\d{2}$/.test(r.usedAt)).map(r => ({date:r.date, usedAt:r.usedAt})).slice(-120) : []
  };
}
function hexLum(hex){
  const n = parseInt(hex.slice(1), 16);
  const ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
}
function applyAccent(){
  const a = state.config.accent || {id:"laranja"};
  const p = ACCENTS.find(x => x.id === a.id);
  let l, d, on;
  if (p){ l = p.l; d = p.d; on = p.on; }
  else if (a.custom){ l = d = a.custom; on = hexLum(a.custom) > 0.45 ? "#141416" : "#FFFFFF"; }
  else { l = ACCENTS[0].l; d = ACCENTS[0].d; on = ACCENTS[0].on; }
  const st = document.documentElement.style;
  st.setProperty("--acc-l", l); st.setProperty("--acc-d", d); st.setProperty("--acc-on", on);
}
function loadCfg(){ try{ const c = JSON.parse(localStorage.getItem(CFG_KEY) || "null"); if (c) applyCfg(c); if (c && c.dirty) state.cfgDirty = true; }catch(e){} }
function saveCfg(){ try{ localStorage.setItem(CFG_KEY, JSON.stringify(Object.assign({dirty:state.cfgDirty}, state.config))); }catch(e){} }
function isoOf(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function parseISO(iso){ const p = iso.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2], 12); }
function addDays(iso, n){ const d = parseISO(iso); d.setDate(d.getDate() + n); return isoOf(d); }
function mondayOf(iso){ const d = parseISO(iso); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return isoOf(d); }
function weeksBetween(a, b){ return Math.round((parseISO(b) - parseISO(a)) / (7 * 86400000)); }
function isDeload(iso){ return state.config.deloadWeeks.includes(mondayOf(iso)); }
function deloadNow(){ return isDeload(isoToday()); }
function setsFor(ex){
  if (!deloadNow()) return ex.sets;
  const iso = ex.sets[0].goal === 15 || ex.pyramid;
  return [0, 1].map(() => iso ? {goal:10, label:"9–10"} : {goal:6, label:"5–6"});
}
async function writeCfg(){
  state.cfgDirty = true; saveCfg();
  if (state.mode !== "db" || !state.cfgRef) return;
  if (state.cfgWriting){ state.cfgAgain = true; return; }
  state.cfgWriting = true; setStatus("saving");
  try{
    await state.cfgRef.set({deloadWeeks:state.config.deloadWeeks.slice(), cycle:state.config.cycle, restores:state.config.restores.slice(), accent:Object.assign({}, state.config.accent), ranking:!!state.config.ranking, shareLoads:!!state.config.shareLoads, shareShape:!!state.config.shareShape, avatar:state.config.avatar ? Object.assign({}, state.config.avatar) : null, unitOk:Object.assign({}, state.config.unitOk || {}), theme:state.config.theme || "auto"});
    if (!state.cfgAgain){ state.cfgDirty = false; saveCfg(); }
    if (!anyPending()) setStatus("saved");
  }catch(e){
    const code = e && e.code;
    setStatus(code === "quota_exceeded" ? "full" : "offline");
  }finally{
    state.cfgWriting = false;
    if (state.cfgAgain){ state.cfgAgain = false; writeCfg(); }
  }
}
function subscribeCfg(){
  state.cfgRef.onSnapshot(snap => {
    if (state.link && state.link.cfg){ state.link.cfg = false; if (snap.exists && !state.cfgWriting){ state.cfgDirty = false; saveCfg(); } }
    if (state.cfgDirty || state.cfgWriting){ writeCfg(); return; }
    if (snap.exists){ applyCfg(snap.data() || {}); applyAccent(); applyTheme(); saveCfg(); onData(); }
  }, () => {});
}
function nextDeload(){
  const cur = mondayOf(isoToday());
  const weeks = state.config.deloadWeeks;
  const future = weeks.filter(w => w >= cur);
  if (future.length) return {week:future[0], planned:true};
  const past = weeks.filter(w => w < cur);
  const logged = loggedSessions();
  let w;
  if (past.length) w = addDays(past[past.length - 1], 7 * (state.config.cycle + 1));
  else w = addDays(logged.length ? mondayOf(logged[0].date) : cur, 7 * state.config.cycle);
  return {week:w < cur ? cur : w, planned:false};
}
function cycleWeek(){
  const cur = mondayOf(isoToday());
  const past = state.config.deloadWeeks.filter(w => w < cur);
  const logged = loggedSessions();
  const base = past.length ? addDays(past[past.length - 1], 7) : (logged.length ? mondayOf(logged[0].date) : cur);
  return Math.max(1, weeksBetween(base, cur) + 1);
}
